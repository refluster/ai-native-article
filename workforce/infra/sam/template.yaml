AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: |
  Workforce data plane (PR4).

  Carries the persistent surface every later workforce PR depends on:
    - DynamoDB single-table (wf-table-{Stage}) per R-N2 / data-model.md.
    - S3 bucket (wf-bucket-{AccountId}-{Stage}) per R-N2 / data-model.md.
    - SNS topic (wf-alarm-topic-{Stage}) for Lambda failure alarms once
      Lambdas land in PR5/PR6.
    - AWS Budgets monthly cap (W-3) with email + SNS notifications.

  No Lambda functions yet — those land in PR5 (agents-api + seed) and
  PR6 (orchestrator + agent-runner). Globals are pre-set to nodejs24.x
  per operator direction (PR #28 comment).

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
    Description: Deployment stage. Drives all resource suffixes (R-N7).
  MonthlyBudgetUsd:
    Type: Number
    Default: 50
    MinValue: 5
    Description: |
      Monthly USD cap (W-3 ceiling) for this stack. AWS Budgets fires at
      80% and 100% of this value. Raising it is a Zone A change to
      workforce/docs/governance.md §2.
  AlarmEmail:
    Type: String
    Description: |
      Email subscribed to the alarm SNS topic and the budget notifications.
      Operator must confirm the subscription from their inbox.
    AllowedPattern: ".+@.+\\..+"
  EngineerOwner:
    Type: String
    Default: refluster
    Description: GitHub owner of the repo the engineer routine targets.
  EngineerRepo:
    Type: String
    Default: ai-native-article
    Description: GitHub repo the engineer routine targets.
  EngineerWorkflow:
    Type: String
    Default: wf-engineer.yml
    Description: workflow_dispatch target filename.
  EngineerRef:
    Type: String
    Default: main
    Description: Ref to dispatch the engineer workflow from.

Globals:
  Function:
    Runtime: nodejs24.x
    MemorySize: 1024
    Timeout: 300
    Architectures: [arm64]
    Environment:
      Variables:
        STAGE: !Ref Stage
        TABLE_NAME: !Ref WfTable
        BUCKET_NAME: !Ref WfBucket
        ALARM_TOPIC_ARN: !Ref WfAlarmTopic
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: "1"

Resources:

  # --- DynamoDB single-table -------------------------------------------------
  # PK/SK schema: see workforce/docs/data-model.md.
  # GSI1 reserved for status-keyed lookups (pending TASKs in PR6+).
  WfTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub wf-table-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: workforce
          Value: !Ref Stage

  # --- S3 bucket -------------------------------------------------------------
  # Layout: memory/{slug}/, articles/{slug}/, plans/{slug}/, design-docs/, launches/.
  # See workforce/docs/data-model.md.
  WfBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub wf-bucket-${AWS::AccountId}-${Stage}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: memory-ia-after-90d
            Status: Enabled
            Prefix: memory/
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 90
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: workforce
          Value: !Ref Stage

  # --- Alarm topic -----------------------------------------------------------
  # Lambdas in PR5/PR6 publish their Errors/Throttles/DLQ-depth alarms here.
  # Also receives the AWS Budgets notifications below.
  WfAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub wf-alarm-topic-${Stage}

  WfAlarmTopicEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref WfAlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # SNS policy permitting AWS Budgets to publish notifications.
  WfAlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref WfAlarmTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowBudgetsPublish
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref WfAlarmTopic

  # --- W-3 monthly budget cap -----------------------------------------------
  # AWS Budgets are account-scoped, so this resource is filtered by the
  # `workforce` tag (applied to WfTable + WfBucket above) to only count
  # this stack's spend.
  WfBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub wf-budget-${Stage}
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        CostFilters:
          TagKeyValue:
            - !Sub "user:workforce$${Stage}"
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref WfAlarmTopic
            - SubscriptionType: EMAIL
              Address: !Ref AlarmEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref WfAlarmTopic
            - SubscriptionType: EMAIL
              Address: !Ref AlarmEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlarmEmail

  # --- Agents CRUD API (RFC-007) --------------------------------------------
  # HTTP API + Lambda + IAM. GET endpoints are public; PATCH/DELETE require
  # AWS_IAM auth (operator only). Creates via API are deliberately not
  # exposed — new personas come from PRs that add agents/{slug}/ files.
  WfAgentsHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - https://kohuehara.xyz
          - http://localhost:5173
        AllowMethods: [GET, OPTIONS]
        AllowHeaders: [content-type]
      Auth:
        EnableIamAuthorizer: true
      Tags:
        workforce: !Ref Stage

  WfAgentsApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub wf-agents-api-${Stage}
      CodeUri: ../../lambdas/agents-api
      Handler: handler.handler
      Description: Workforce agents CRUD API. See workforce/docs/rfcs/rfc-007-agent-management-api.md.
      MemorySize: 512
      Timeout: 10
      Policies:
        - Statement:
            - Sid: AgentsApiTableAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:Scan
                - dynamodb:DeleteItem
              Resource:
                - !GetAtt WfTable.Arn
                - !Sub ${WfTable.Arn}/index/*
      Events:
        ListAgents:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /agents
            Method: GET
        GetAgent:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /agents/{slug}
            Method: GET
        PatchAgent:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /agents/{slug}
            Method: PATCH
            Auth:
              Authorizer: AWS_IAM
        DeleteAgent:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /agents/{slug}
            Method: DELETE
            Auth:
              Authorizer: AWS_IAM
      Tags:
        workforce: !Ref Stage

  # CloudWatch alarm: any Errors metric on the agents-api function
  # publishes to the workforce alarm topic.
  WfAgentsApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub wf-agents-api-errors-alarm-${Stage}
      AlarmDescription: !Sub Errors > 0 on wf-agents-api-${Stage} over 5 minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WfAgentsApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref WfAlarmTopic

  # --- Agents seed Lambda (RFC-007) -----------------------------------------
  # Reads workforce/agents/{slug}/{agent.json, system.md} from the deployed
  # bundle (the Makefile builder copies the tree into ARTIFACTS_DIR/agents/)
  # and upserts AGENT#{slug}/META rows. Identity-hash gates idempotency:
  # an unchanged file set is a no-op. Operational fields preserved on
  # re-seed.
  #
  # Invoked manually via `aws lambda invoke` for now. The post-deploy
  # auto-trigger (RFC-007 Q1) lands in a follow-up.
  WfSeedAgentsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub wf-seed-agents-${Stage}
      CodeUri: ../../lambdas/seed-agents
      Handler: handler.handler
      Description: Workforce agents seed. Files -> DDB AGENT#{slug}/META. See RFC-007.
      MemorySize: 512
      Timeout: 60
      Policies:
        - Statement:
            - Sid: SeedAgentsTableAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource:
                - !GetAtt WfTable.Arn
      Tags:
        workforce: !Ref Stage

  WfSeedAgentsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub wf-seed-agents-errors-alarm-${Stage}
      AlarmDescription: !Sub Errors > 0 on wf-seed-agents-${Stage} over 5 minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WfSeedAgentsFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref WfAlarmTopic

  # --- Agent runner Lambda (PR6b) -------------------------------------------
  # Invoked async by the orchestrator (PR6c) with { agent, task_kind, ... }.
  # Composes shared/* libs into the per-agent execution loop:
  # load META -> memory -> budget guard -> LLM -> Notion -> memory append ->
  # RUN + DELIV rows + BUDGET roll-up.
  #
  # Reads workforce/agents/{slug}/system.md from the bundle (Makefile build
  # copies the tree, same pattern as seed-agents).
  WfAgentRunnerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub wf-agent-runner-${Stage}
      CodeUri: ../../lambdas/agent-runner
      Handler: handler.handler
      Description: Workforce agent execution loop. PR6b.
      MemorySize: 1024
      Timeout: 300
      Policies:
        - Statement:
            - Sid: RunnerDdbRw
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt WfTable.Arn
            - Sid: RunnerS3Rw
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - !Sub ${WfBucket.Arn}/memory/*
                - !Sub ${WfBucket.Arn}/articles/*
                - !Sub ${WfBucket.Arn}/plans/*
                - !Sub ${WfBucket.Arn}/design-docs/*
                - !Sub ${WfBucket.Arn}/launches/*
            - Sid: RunnerSecretsRead
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wf/anthropic-*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wf/notion-*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wf/github-*
      Environment:
        Variables:
          ENGINEER_OWNER: !Ref EngineerOwner
          ENGINEER_REPO: !Ref EngineerRepo
          ENGINEER_WORKFLOW: !Ref EngineerWorkflow
          ENGINEER_REF: !Ref EngineerRef
      Tags:
        workforce: !Ref Stage

  WfAgentRunnerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub wf-agent-runner-errors-alarm-${Stage}
      AlarmDescription: !Sub Errors > 0 on wf-agent-runner-${Stage} over 5 minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WfAgentRunnerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref WfAlarmTopic

  # --- Orchestrator Lambda + tick rule (PR6c, RFC-006 S1) -------------------
  # One EventBridge rule fires every 5 minutes. The orchestrator scans all
  # AGENT#*/META rows, evaluates each agent's schedule_cron against the
  # 5-minute window, and async-invokes wf-agent-runner-{stage} for the
  # ones that fire. No per-agent CFN rules — workforce scales by adding
  # data rows, not template resources.
  WfOrchestratorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub wf-orchestrator-${Stage}
      CodeUri: ../../lambdas/orchestrator
      Handler: handler.handler
      Description: Workforce dispatcher. Reads cron from DDB, async-invokes runner.
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          RUNNER_FUNCTION_NAME: !Ref WfAgentRunnerFunction
          TICK_WINDOW_MINUTES: "5"
          ENGINEER_SLUG: ren
          ENGINEER_OWNER: !Ref EngineerOwner
          ENGINEER_REPO: !Ref EngineerRepo
          ENGINEER_TIMEOUT_MIN: "1440"
      Policies:
        - Statement:
            - Sid: OrchestratorDdbAccess
              Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource: !GetAtt WfTable.Arn
            - Sid: OrchestratorRunnerInvoke
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt WfAgentRunnerFunction.Arn
            - Sid: OrchestratorGithubSecret
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wf/github-*
      Events:
        Tick:
          Type: Schedule
          Properties:
            Name: !Sub wf-orchestrator-tick-${Stage}
            Description: Drives the workforce dispatch loop every 5 minutes.
            Schedule: rate(5 minutes)
            Enabled: false
      Tags:
        workforce: !Ref Stage

  WfOrchestratorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub wf-orchestrator-errors-alarm-${Stage}
      AlarmDescription: !Sub Errors > 0 on wf-orchestrator-${Stage} over 5 minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WfOrchestratorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref WfAlarmTopic

Outputs:
  TableName:
    Description: DynamoDB table name (consumed by PR5/PR6 Lambdas).
    Value: !Ref WfTable
    Export:
      Name: !Sub wf-table-name-${Stage}
  TableArn:
    Value: !GetAtt WfTable.Arn
    Export:
      Name: !Sub wf-table-arn-${Stage}
  BucketName:
    Description: S3 bucket name (consumed by PR5/PR6 Lambdas).
    Value: !Ref WfBucket
    Export:
      Name: !Sub wf-bucket-name-${Stage}
  AlarmTopicArn:
    Description: SNS topic that receives all stack alarms.
    Value: !Ref WfAlarmTopic
    Export:
      Name: !Sub wf-alarm-topic-arn-${Stage}
  AgentsApiUrl:
    Description: Base URL of the agents HTTP API.
    Value: !Sub https://${WfAgentsHttpApi}.execute-api.${AWS::Region}.amazonaws.com
    Export:
      Name: !Sub wf-agents-api-url-${Stage}
