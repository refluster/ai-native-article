AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: |
  Workforce data plane (PR4).

  Carries the persistent surface every later workforce PR depends on:
    - DynamoDB single-table (wf-table-{Stage}) per R-N2 / data-model.md.
    - S3 bucket (wf-bucket-{AccountId}-{Region}-{Stage}) per R-N2 / data-model.md.
    - SNS topic (wf-alarm-topic-{Stage}) for Lambda failure alarms once
      Lambdas land in PR5/PR6.
    - AWS Budgets monthly cap (W-3) with email + SNS notifications.

  No Lambda functions yet — those land in PR5 (agents-api + seed) and
  PR6 (orchestrator + agent-runner). Globals are pre-set to nodejs24.x
  per operator direction (PR #28 comment).

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
    Description: Deployment stage. Drives all resource suffixes (R-N7).
  MonthlyBudgetUsd:
    Type: Number
    Default: 50
    MinValue: 5
    Description: |
      Monthly USD cap (W-3 ceiling) for this stack. AWS Budgets fires at
      80% and 100% of this value. Raising it is a Zone A change to
      workforce/docs/governance.md §2.
  AlarmEmail:
    Type: String
    Description: |
      Email subscribed to the alarm SNS topic and the budget notifications.
      Operator must confirm the subscription from their inbox.
    AllowedPattern: ".+@.+\\..+"
  EngineerOwner:
    Type: String
    Default: refluster
    Description: GitHub owner of the repo the engineer routine targets.
  EngineerRepo:
    Type: String
    Default: ai-native-article
    Description: GitHub repo the engineer routine targets.
  EngineerWorkflow:
    Type: String
    Default: workforce-engineer-routine.yml
    Description: workflow_dispatch target filename.
  EngineerRef:
    Type: String
    Default: main
    Description: Ref to dispatch the engineer workflow from.

Globals:
  Function:
    Runtime: nodejs24.x
    MemorySize: 1024
    Timeout: 300
    Architectures: [arm64]
    Environment:
      Variables:
        STAGE: !Ref Stage
        TABLE_NAME: !Ref WfTable
        BUCKET_NAME: !Ref WfBucket
        ALARM_TOPIC_ARN: !Ref WfAlarmTopic
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: "1"

Resources:

  # --- DynamoDB single-table -------------------------------------------------
  # PK/SK schema: see workforce/docs/data-model.md.
  # GSI1 reserved for status-keyed lookups (pending TASKs in PR6+).
  WfTable:
    Type: AWS::DynamoDB::Table
    # Protect against accidental stack-delete or replace-update on prod
    # (per Story 1-A review). The table holds every workforce-state row;
    # losing it on an unrelated stack-delete is unrecoverable.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub wf-table-${Stage}
      BillingMode: PAY_PER_REQUEST
      # ADR-0005 item 5: garbage-collect expired ephemeral engagement-write
      # tokens (AUTH#ENGAGEMENT rows carry a `ttl` epoch-seconds attribute).
      # TTL is best-effort cleanup; the agents-api validity check is the
      # source of truth, so correctness doesn't depend on deletion timing.
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
        - AttributeName: gsi2pk
          AttributeType: S
        - AttributeName: gsi2sk
          AttributeType: S
        # GSI3 — workforce activity feed (Epic-011 Story 1, #128).
        # gsi3pk="FEED" / gsi3sk=posted_at. Single global partition; see
        # workforce/docs/data-model.md "GSI3 — workforce activity feed".
        - AttributeName: gsi3pk
          AttributeType: S
        - AttributeName: gsi3sk
          AttributeType: S
        # GSI4 — talent-messaging inbox (Epic-013 Story 1, #248).
        # gsi4pk="INBOX#{slug}" / gsi4sk=last_message_at. One partition per
        # participant; see workforce/docs/data-model.md "GSI4 — messaging inbox".
        - AttributeName: gsi4pk
          AttributeType: S
        - AttributeName: gsi4sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: gsi2pk
              KeyType: HASH
            - AttributeName: gsi2sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # GSI3 — global workforce activity feed.
        # Added by Epic-011 Story 1 (#128). Deploy-time risk: adding a GSI
        # to an existing populated table triggers an online index build —
        # `IndexStatus` flips to CREATING for the duration. The window is
        # identifiable in CloudTrail by isolating this change in its own
        # commit (per #128 AC). Current `wf-table-dev` row count is small
        # (~ low thousands), so the build completes in minutes; at the
        # Epic-010 EXEC-ledger growth rate, schedule subsequent GSI adds
        # before the table is at scale.
        - IndexName: GSI3
          KeySchema:
            - AttributeName: gsi3pk
              KeyType: HASH
            - AttributeName: gsi3sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # GSI4 — talent-messaging inbox (Epic-013 Story 1, #248). One
        # partition per participant (`INBOX#{slug}`), reverse-chrono on
        # last_message_at. Same online-index-build caveat as GSI3 above:
        # isolate this add in its own commit. Writes are operator-paced
        # (Epic-013 §Behaviour at N=100), so the partition stays cool.
        - IndexName: GSI4
          KeySchema:
            - AttributeName: gsi4pk
              KeyType: HASH
            - AttributeName: gsi4sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: workforce
          Value: !Ref Stage

  # --- S3 bucket -------------------------------------------------------------
  # Layout: memory/{slug}/, articles/{slug}/, plans/{slug}/, design-docs/, launches/.
  # See workforce/docs/data-model.md.
  WfBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub wf-bucket-${AWS::AccountId}-${AWS::Region}-${Stage}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: memory-ia-after-90d
            Status: Enabled
            Prefix: memory/
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 90
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: workforce
          Value: !Ref Stage

  # --- Alarm topic -----------------------------------------------------------
  # Lambdas in PR5/PR6 publish their Errors/Throttles/DLQ-depth alarms here.
  # Also receives the AWS Budgets notifications below.
  WfAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub wf-alarm-topic-${Stage}

  WfAlarmTopicEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref WfAlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # SNS policy permitting AWS Budgets to publish notifications.
  WfAlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref WfAlarmTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowBudgetsPublish
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref WfAlarmTopic

  # --- W-3 monthly budget cap -----------------------------------------------
  # AWS Budgets are account-scoped, so this resource is filtered by the
  # `workforce` tag (applied to WfTable + WfBucket above) to only count
  # this stack's spend.
  WfBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub wf-budget-${Stage}
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        CostFilters:
          TagKeyValue:
            - !Sub "user:workforce$${Stage}"
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref WfAlarmTopic
            - SubscriptionType: EMAIL
              Address: !Ref AlarmEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref WfAlarmTopic
            - SubscriptionType: EMAIL
              Address: !Ref AlarmEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlarmEmail

  # --- Agents CRUD API (Epic-007) --------------------------------------------
  # HTTP API + Lambda + IAM. GET endpoints are public; PATCH/DELETE require
  # AWS_IAM auth (operator only). Creates via API are deliberately not
  # exposed — new personas come from PRs that add agents/{slug}/ files.
  WfAgentsHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        # Three trusted origins:
        #   - kohuehara.xyz (the public site; also reads the agents catalogue
        #     for the about page)
        #   - workforce.kohuehara.xyz (the operator SPA — feed UI lives here)
        #   - localhost:5173 (dev)
        # Epic-011 Story 5 (#132): the feed `GET` endpoints rely on this
        # CORS gate to limit browser access to the workforce origin. The
        # threat model (PR #132 body) accepts hostname-guess access as the
        # blast-radius envelope; the gate is a friction layer, not auth.
        AllowOrigins:
          - https://kohuehara.xyz
          - https://workforce.kohuehara.xyz
          - http://localhost:5173
        # PATCH added by Epic-011 Story 5 (#132) for the feed-hide route.
        # PATCH /agents/{slug} (Epic-007) is also IAM-authed; it's called
        # by `aws-vault` from a terminal today rather than the browser, but
        # adding PATCH here keeps the CORS surface honest if the operator
        # SPA later issues a PATCH from the browser via signed-SigV4.
        # POST added by Epic-013 Story 2 (#249) for the talent-messaging
        # operator write routes (start thread / send / read / star), gated
        # by AWS_IAM (SigV4) — the SPA calls them with signed requests just
        # like the existing PATCH writes.
        AllowMethods: [GET, POST, PATCH, OPTIONS]
        # SigV4-signed browser requests (aws4fetch) send more than
        # `authorization`: the preflight `Access-Control-Request-Headers`
        # also lists `x-amz-date`, `x-amz-content-sha256`, and (with
        # temporary Cognito creds) `x-amz-security-token`. All must be in
        # AllowHeaders or the browser blocks the actual request.
        AllowHeaders:
          - content-type
          - authorization
          - x-amz-date
          - x-amz-content-sha256
          - x-amz-security-token
      Auth:
        EnableIamAuthorizer: true
        # Epic-013 Story 2 (#249) / decision D3 (revised — see #256 follow-up)
        # — operator write routes for talent messaging authenticate with
        # AWS_IAM (SigV4), the same gate every other operator write on this
        # API already uses (PATCH /agents, PATCH /feed, PATCH /projects).
        # The SPA signs in via the workforce Cognito user pool (infra/sam-web)
        # and mints temporary AWS credentials from the workforce Identity
        # Pool, whose operator role (WfWorkforceOperatorRole) already grants
        # execute-api:Invoke on this whole API — so these routes reuse the
        # existing operator login rather than standing up a second, redundant
        # user pool + JWT authorizer. Read routes stay public on the CORS
        # gate (Epic-011 §6 posture).
      Tags:
        workforce: !Ref Stage

  WfAgentsApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub wf-agents-api-${Stage}
      CodeUri: ../../lambdas/agents-api
      Handler: handler.handler
      Description: Workforce agents CRUD API. See workforce/docs/epics/epic-007-agent-management-api.md.
      MemorySize: 512
      Timeout: 10
      Environment:
        # Merged with Globals.Function.Environment. Epic-013 Story 3 (ADR-0006):
        # the operator write routes async-invoke the real-time reply Lambda by
        # name after persisting the operator's message.
        Variables:
          MESSAGING_REPLY_FUNCTION: !Ref WfMessagingReplyFunction
      Policies:
        - Statement:
            - Sid: AgentsApiTableAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:DeleteItem
                # PutItem: POST /feed writes the POST# row (Epic-011
                # feed-post write path / createPost).
                - dynamodb:PutItem
              Resource:
                - !GetAtt WfTable.Arn
                - !Sub ${WfTable.Arn}/index/*
            - Sid: AgentsApiPutMalformedMetric
              # Defence-in-depth metric on listProjects' row-shape skip
              # path (FU-NEW-D). The handler emits WfMalformedProjectMeta
              # under Workforce/AgentsApi when a META row missing the
              # canonical attributes is dropped from the list response —
              # surfaces operator-side bootstrap-runbook regressions
              # without 500-ing the whole route. Namespace condition
              # mirrors the runner / backfill patterns.
              Effect: Allow
              Action: cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace:
                    - Workforce/AgentsApi
                    # Epic-012 Story 4: GET /agents/{slug}/recall emits
                    # WfRecallLatencyMs / WfRecallVintageMismatch via recall().
                    - Workforce/Recall
            # Epic-011 Story 5 (#132) — `GET /feed/{post_id}` hydrates
            # post bodies from S3 (`posts/{slug}/{yyyy}/{mm}/{ulid}.md`).
            # No write needed — the feed-post skill (Story 1) writes; the
            # API only reads.
            - Sid: AgentsApiPostBodyRead
              Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub ${WfBucket.Arn}/posts/*
            # Epic-013 Story 1 (#248) — `GET /threads/{id}` hydrates long
            # message bodies from S3 (`messages/{thread_id}/{ulid}.md`).
            # Read-only here; the operator write path (Story 2) adds PutObject.
            - Sid: AgentsApiMessageBodyRead
              Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub ${WfBucket.Arn}/messages/*
            # Epic-013 Story 2 (#249) — the operator write routes store long
            # message bodies (>320c) before the DDB MSG row (createThread /
            # sendMessage ordering). Scoped to messages/*.
            - Sid: AgentsApiMessageBodyWrite
              Effect: Allow
              Action: s3:PutObject
              Resource:
                - !Sub ${WfBucket.Arn}/messages/*
            - Sid: AgentsApiPostBodyWrite
              # POST /feed writes the post body to posts/{slug}/{yyyy}/{mm}/{ulid}.md
              # before the DDB row (createPost ordering). Scoped to posts/*.
              Effect: Allow
              Action: s3:PutObject
              Resource:
                - !Sub ${WfBucket.Arn}/posts/*
            - Sid: AgentsApiFeedWriteToken
              # POST /feed validates the runner's bearer token against this
              # one secret (validateFeedWriteBearer). GetSecretValue scoped
              # to the single feed-write-token path — NOT the broader
              # wf/projects/* (the LIST-credentials route uses DescribeSecret
              # only and never reads values).
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wf/projects/agent-workforce/workforce.feed_write_token-*
            - Sid: AgentsApiEngagementWriteToken
              # Phase 7 PR5 — POST /agents/{slug}/engagements validates
              # external clients' bearer tokens against this single shared
              # secret (validateEngagementWriteBearer). Same scoping
              # discipline as AgentsApiFeedWriteToken: one secret only,
              # GetSecretValue read by this handler at warm-cache time.
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wf/api/engagements-write-token-*
            # Issue #158 PR-β A1: project credentials LIST endpoint
            # (`GET /projects/{id}/credentials`) describes each
            # registered credential type's secret to surface metadata
            # (last_changed_at / created_date). DescribeSecret never
            # returns the SecretString, so the LIST stays metadata-only
            # by construction at the AWS API layer (Story 2-C's secret-
            # leak guard property at the handler layer is a
            # belt-and-braces second.) Resource scoped to
            # `wf/projects/*` so the Lambda role cannot describe
            # credentials outside the trust boundary.
            - Sid: AgentsApiProjectCredentialsDescribe
              Effect: Allow
              Action: secretsmanager:DescribeSecret
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wf/projects/*
            # Epic-012 Story 1: GET /agents/{slug}/recall embeds the query
            # via Voyage; recall() resolves voyage.api_key from the project
            # credential bag (wf/projects/{id}/voyage.api_key, falling back to
            # wf/projects/_default/voyage.api_key). Scoped to the voyage key
            # path only — NOT a broad wf/projects/* GetSecretValue — so the
            # recall route can read the embedding key without widening to
            # every project credential value.
            - Sid: AgentsApiRecallVoyageKey
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wf/projects/*/voyage.api_key-*
            # Epic-013 Story 3 (ADR-0006) — the operator write routes async-
            # invoke the real-time reply Lambda. Scoped to that one function.
            - Sid: AgentsApiInvokeMessagingReply
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !GetAtt WfMessagingReplyFunction.Arn
      Events:
        ListAgents:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /agents
            Method: GET
        # PR #274 — dashboard aggregate (EXEC-ledger roll-up: runs/deliv MTD,
        # 30-day heat strip, live trace, run-duration KPI). Public read
        # (CORS-gated), same shape as the other GET routes. The handler route
        # shipped in #274 without this event, 404ing the whole console
        # (the SPA's Promise.all couples the crew index to this fetch).
        GetStats:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /stats
            Method: GET
        GetAgent:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /agents/{slug}
            Method: GET
        PatchAgent:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /agents/{slug}
            Method: PATCH
            Auth:
              Authorizer: AWS_IAM
        DeleteAgent:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /agents/{slug}
            Method: DELETE
            Auth:
              Authorizer: AWS_IAM
        # Epic-008 PR-D: skills read-only routes on the same HTTP API.
        # GET /skills + GET /skills/{name}. No PATCH/DELETE on skills at
        # v1 — operational mutations go through PRs that edit meta.json.
        ListSkills:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /skills
            Method: GET
        GetSkill:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /skills/{name}
            Method: GET
        # Epic-010 §10 Story 6 (#95): projects read API on the same Lambda.
        # POST/DELETE/PATCH on projects are intentionally not exposed (see
        # handler.ts header). The credential vault lives in its own Lambda
        # (Story 2-C #91) so this Lambda's IAM scope stays narrow per R-N3.
        # Routes use a non-greedy `{id}` param, NOT the greedy `{id+}`
        # proxy: a greedy parent (`/projects/{id+}`) conflicts with its
        # child routes (`/projects/{id}/members` etc.) on HTTP API import,
        # so API Gateway silently drops the children. Project ids that
        # contain `/` (e.g. `self/ren`) are percent-encoded by the client,
        # so they still match a single `{id}` segment.
        ListAgentProjects:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /agents/{slug}/projects
            Method: GET
        # Epic-010 ROADMAP §Status-transition criterion 3 (C3) — agent
        # profile reads execution history from the EXEC row family via
        # GSI1 instead of the legacy AGENT#{slug}/RUN#{ulid} +
        # AGENT#{slug}/DELIV#{ulid} rows. Public read (CORS-gated).
        ListAgentExecutions:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /agents/{slug}/executions
            Method: GET
        # Epic-012 Story 1: recall inspection surface — same recall() path
        # the agent-runner uses to ground a run. Public read (CORS-gated),
        # caller-scoped to {slug} inside recall().
        GetAgentRecall:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /agents/{slug}/recall
            Method: GET
        # Phase 7 PR5 — engagements API (external-client surface).
        # Portfolio is the public-facing read of executions filtered to
        # the calling client's project_id. Same access shape as
        # ListAgentExecutions; the handler enforces the project filter
        # so cross-project leak is prevented at the application layer.
        ListAgentPortfolio:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /agents/{slug}/portfolio
            Method: GET
        # POST /agents/{slug}/engagements — external clients (RepoA-style)
        # POST engagement records (client-side execution outcomes) back
        # to the workforce's ledger. Bearer-token auth at the handler
        # (not AWS_IAM at API GW — the external client has no SigV4
        # creds), matching the POST /feed pattern. Token lives at
        # wf/api/engagements-write-token.
        CreateEngagement:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /agents/{slug}/engagements
            Method: POST
        ListProjects:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /projects
            Method: GET
        GetProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /projects/{id}
            Method: GET
        ListProjectMembers:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /projects/{id}/members
            Method: GET
        ListProjectExecutions:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /projects/{id}/executions
            Method: GET
        # Issue #158 PR-β: project credentials LIST (public read, metadata-only)
        # and project PATCH (AWS_IAM auth) so the operator can flip
        # status=archived from the SPA without dropping to the CLI.
        ListProjectCredentials:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /projects/{id}/credentials
            Method: GET
        PatchProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /projects/{id}
            Method: PATCH
            Auth:
              Authorizer: AWS_IAM
        # Epic-011 Story 5 (#132): workforce activity-feed read endpoints.
        # GET endpoints are public (CORS gate admits `workforce.kohuehara.xyz`
        # only); PATCH requires AWS_IAM (operator's `aws-vault` credentials)
        # because it flips the `visibility=hidden` audit attribute via
        # Story 4's `hidePost` helper. Threat model documented in PR #132.
        ListFeed:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /feed
            Method: GET
        GetFeedPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /feed/{post_id}
            Method: GET
        CreateFeedPost:
          # Runner write path (Epic-011 feed-post → DDB). No API GW
          # authorizer: the CCR session has no SigV4 creds, so auth is
          # bearer-token at the handler layer (validateFeedWriteBearer →
          # wf/projects/agent-workforce/workforce.feed_write_token).
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /feed
            Method: POST
        PatchFeedPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /feed/{post_id}
            Method: PATCH
            Auth:
              Authorizer: AWS_IAM
        ListAgentPosts:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /agents/{slug}/posts
            Method: GET
        # Talent messaging — read endpoints (Epic-013 Story 1, #248).
        # Public on the CORS gate like the feed reads; the write routes
        # (Story 2) add the operator Bearer gate at the handler layer.
        ListThreads:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /threads
            Method: GET
        GetThread:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /threads/{id}
            Method: GET
        # Operator write routes (Epic-013 Story 2, #249) — gated by AWS_IAM
        # (decision D3, revised in the #256 follow-up): the operator's SPA
        # signs these with SigV4 using temporary creds from the workforce
        # Identity Pool, same as the PATCH writes above. No talent ever
        # posts a message from the UI; talent messages come from the
        # messaging-reply runner path (Story 3).
        CreateThread:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /threads
            Method: POST
            Auth:
              Authorizer: AWS_IAM
        SendThreadMessage:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /threads/{id}/messages
            Method: POST
            Auth:
              Authorizer: AWS_IAM
        MarkThreadRead:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /threads/{id}/read
            Method: POST
            Auth:
              Authorizer: AWS_IAM
        SetThreadStar:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfAgentsHttpApi
            Path: /threads/{id}/star
            Method: POST
            Auth:
              Authorizer: AWS_IAM
      Tags:
        workforce: !Ref Stage

  # CloudWatch alarm: any Errors metric on the agents-api function
  # publishes to the workforce alarm topic.
  WfAgentsApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub wf-agents-api-errors-alarm-${Stage}
      AlarmDescription: !Sub Errors > 0 on wf-agents-api-${Stage} over 5 minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WfAgentsApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref WfAlarmTopic

  # --- Messaging reply Lambda (Epic-013 Story 3, ADR-0006) -------------------
  # The real-time talent-reply path. Async-invoked by the agents-api operator
  # write routes after an operator message persists. Loads the thread, composes
  # the addressed agent's persona (agents/{slug}/system.md, bundled into the
  # artefact like wf-seed-agents) + a tight reply prompt, calls Claude once via
  # the shared wf/anthropic secret, enforces the W-1 guards, and writes the
  # talent MSG# row via the shared messaging module. See the handler header and
  # workforce/docs/adr/adr-0006-realtime-messaging-reply.md for why this is a
  # deliberate second execution surface alongside the batch CCR runner.
  WfMessagingReplyFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub wf-messaging-reply-${Stage}
      CodeUri: ../../lambdas/messaging-reply
      Handler: handler.handler
      Description: Real-time talent reply to operator messages (Epic-013 Story 3).
      MemorySize: 512
      # One Claude call + a handful of DDB/S3 ops. Generous ceiling; replies
      # land in seconds in the normal case.
      Timeout: 60
      Policies:
        - Statement:
            - Sid: MessagingReplyTableAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt WfTable.Arn
                - !Sub ${WfTable.Arn}/index/*
            - Sid: MessagingReplyMessageBodyRead
              # resolveMessageBody hydrates long message bodies from S3 when
              # reading the transcript.
              Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub ${WfBucket.Arn}/messages/*
            - Sid: MessagingReplyMessageBodyWrite
              # sendMessage stores long reply bodies (>preview cap) before the
              # DDB MSG row. Scoped to messages/*.
              Effect: Allow
              Action: s3:PutObject
              Resource:
                - !Sub ${WfBucket.Arn}/messages/*
            - Sid: MessagingReplyAnthropicKey
              # The persona reply is generated via shared/llm-anthropic.ts,
              # which reads the same wf/anthropic secret every agent uses. One
              # secret only — no new credential introduced by Story 3.
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wf/anthropic-*
            - Sid: MessagingReplyMetrics
              Effect: Allow
              Action: cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace:
                    - Workforce/Messaging
      Tags:
        workforce: !Ref Stage

  # Any Errors metric on the reply function publishes to the alarm topic —
  # a thrown W-1 guard (truncation / artefact) or a dispatch bug surfaces here.
  WfMessagingReplyErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub wf-messaging-reply-errors-alarm-${Stage}
      AlarmDescription: !Sub Errors > 0 on wf-messaging-reply-${Stage} over 5 minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WfMessagingReplyFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref WfAlarmTopic

  # --- Agents seed Lambda (Epic-007) -----------------------------------------
  # Reads workforce/agents/{slug}/{agent.json, system.md} from the deployed
  # bundle (the Makefile builder copies the tree into ARTIFACTS_DIR/agents/)
  # and upserts AGENT#{slug}/META rows. Identity-hash gates idempotency:
  # an unchanged file set is a no-op. Operational fields preserved on
  # re-seed.
  #
  # Invoked automatically on every successful stack CREATE/UPDATE via the
  # PostDeploy EventBridge rule below (Epic-007 Q1 default-(b): EventBridge
  # rule on CloudFormation Stack Status Change). The Lambda is idempotent
  # via identity_hash, so over-firing is harmless.
  WfSeedAgentsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub wf-seed-agents-${Stage}
      CodeUri: ../../lambdas/seed-agents
      Handler: handler.handler
      Description: Workforce agents seed. Files -> DDB AGENT#{slug}/META. See Epic-007.
      MemorySize: 512
      Timeout: 60
      Policies:
        - Statement:
            - Sid: SeedAgentsTableAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource:
                - !GetAtt WfTable.Arn
      Events:
        PostDeploy:
          # Fires after every successful stack CREATE/UPDATE of *this*
          # data-plane stack. Stack-id is a prefix filter because the
          # full ARN includes a UUID suffix. The seed Lambda is
          # idempotent, so any spurious match is a cheap no-op.
          Type: EventBridgeRule
          Properties:
            RuleName: !Sub wf-seed-agents-postdeploy-${Stage}
            Pattern:
              source:
                - aws.cloudformation
              detail-type:
                - CloudFormation Stack Status Change
              detail:
                stack-id:
                  - prefix: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/wf-data-plane-${Stage}/
                status-details:
                  status:
                    - CREATE_COMPLETE
                    - UPDATE_COMPLETE
      Tags:
        workforce: !Ref Stage

  # --- Backfill: TASK rows missing project_id (Epic-010 Story 1-B) --------
  # Operator-invoked one-shot. Scans TASK#*/META rows; for each missing
  # `project_id`, fills in `self/{agent_slug}` under a conditional write
  # (idempotent across re-runs). Emits CW metrics into Workforce/Backfill.
  WfBackfillTasksFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub wf-backfill-tasks-${Stage}
      CodeUri: ../../lambdas/backfill-tasks
      Handler: handler.handler
      Description: One-shot backfill — fills TASK.project_id with self/{slug}. Epic-010 Story 1-B.
      MemorySize: 512
      Timeout: 300
      Policies:
        - Statement:
            - Sid: BackfillTasksTableAccess
              Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt WfTable.Arn
            - Sid: BackfillTasksPutMetric
              Effect: Allow
              Action: cloudwatch:PutMetricData
              # PutMetricData does not support resource-level permissions;
              # constrain by namespace via condition.
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace: Workforce/Backfill
      Tags:
        workforce: !Ref Stage

  # --- Credentials write API (Epic-010 Story 2-C) ----------------------------
  # Operator-only write-side API for project credentials. Mirrors the
  # agents-api shape (separate HttpApi + IAM authoriser) so the IAM scope
  # stays narrow — this Lambda is the ONLY caller with secretsmanager:
  # CreateSecret/PutSecretValue/DescribeSecret/DeleteSecret authority on
  # the wf/projects/* namespace.
  #
  # Why a separate HTTP API (not glued onto WfAgentsHttpApi):
  #   - WfAgentsHttpApi's CORS AllowMethods is [GET, OPTIONS]; credentials
  #     needs PUT/DELETE too. Adding them to the public agents API would
  #     widen the cors surface for read-only resources.
  #   - Auth on every credentials route is AWS_IAM (operator-only). Hosting
  #     on a dedicated API lets the operator graph "credentials API hits"
  #     separately from "agents API hits."
  #
  # Routes:
  #   GET    /projects/{slug}/credentials/{type}   metadata only
  #   PUT    /projects/{slug}/credentials/{type}   create or rotate
  #   DELETE /projects/{slug}/credentials/{type}   schedule deletion (7d window)
  WfCredentialsHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - https://kohuehara.xyz
          - https://workforce.kohuehara.xyz
          - http://localhost:5173
        AllowMethods: [GET, PUT, DELETE, OPTIONS]
        # Every route here is AWS_IAM, so the SPA always calls via SigV4
        # (aws4fetch). The preflight requests x-amz-* signing headers in
        # addition to authorization; omitting them is what made the
        # credentials preflight fail. Keep in sync with WfAgentsHttpApi.
        AllowHeaders:
          - content-type
          - authorization
          - x-amz-date
          - x-amz-content-sha256
          - x-amz-security-token
      Auth:
        EnableIamAuthorizer: true
        # Default every route on this API to AWS_IAM so a future route
        # added without an explicit Authorizer cannot accidentally
        # publish a public credentials surface.
        DefaultAuthorizer: AWS_IAM
      Tags:
        workforce: !Ref Stage

  WfCredentialsApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub wf-credentials-api-${Stage}
      CodeUri: ../../lambdas/credentials-api
      Handler: handler.handler
      Description: Workforce credentials write API (PUT/DELETE/GET metadata-only). Epic-010 Story 2-C.
      MemorySize: 512
      Timeout: 15
      Policies:
        - Statement:
            - Sid: CredentialsApiTableAccess
              # getProject + appendExecution + addMember + isMember all
              # hit the workforce single table. Same surface the
              # agents-api Lambda needs.
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource:
                - !GetAtt WfTable.Arn
                - !Sub ${WfTable.Arn}/index/*
            - Sid: CredentialsApiSecretsWrite
              # Resource-scoped to the canonical project-credentials
              # namespace. The bare `wf/{type}` legacy namespace is
              # intentionally OUT of scope: this API only writes the
              # post-Story-2-B canonical path. Legacy keys are read by
              # the runner only and will be deleted in a separate
              # follow-up once WfLegacyCredentialReads graphs to zero.
              Effect: Allow
              Action:
                - secretsmanager:CreateSecret
                - secretsmanager:PutSecretValue
                - secretsmanager:DescribeSecret
                - secretsmanager:DeleteSecret
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wf/projects/*
      Events:
        GetCredential:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfCredentialsHttpApi
            Path: /projects/{slug}/credentials/{type}
            Method: GET
        PutCredential:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfCredentialsHttpApi
            Path: /projects/{slug}/credentials/{type}
            Method: PUT
        DeleteCredential:
          Type: HttpApi
          Properties:
            ApiId: !Ref WfCredentialsHttpApi
            Path: /projects/{slug}/credentials/{type}
            Method: DELETE
      Tags:
        workforce: !Ref Stage

  WfCredentialsApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub wf-credentials-api-errors-alarm-${Stage}
      AlarmDescription: !Sub Errors > 0 on wf-credentials-api-${Stage} over 5 minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WfCredentialsApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref WfAlarmTopic

  # --- Migration: bare wf/{type} -> wf/projects/_default/{type} (Epic-010 §6) -
  # Operator-invoked one-shot. Copies the legacy bare-path credentials
  # (provisioned pre-Epic-010) into the type-keyed canonical paths under
  # the `_default` pseudo-project. Idempotent re-runs are safe (the
  # CreateSecret race resolves to `already_migrated`). Emits CW metrics
  # under Workforce/Credentials. Discord bot tokens are NOT in scope
  # (existing wf/discord-* keys are webhooks, a different credential type).
  WfMigrateCredentialsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub wf-migrate-credentials-${Stage}
      CodeUri: ../../lambdas/migrate-credentials
      Handler: handler.handler
      Description: One-shot — copies legacy wf/{type} secrets to wf/projects/_default/{type}. Epic-010 Story 2-B.
      MemorySize: 512
      Timeout: 300
      Policies:
        - Statement:
            - Sid: MigrateCredentialsReadLegacy
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wf/anthropic-*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wf/notion-*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wf/github-*
            - Sid: MigrateCredentialsWriteDefault
              Effect: Allow
              # CreateSecret takes a wildcard Resource — the action does
              # not yet exist, so resource-level ARN matching isn't a
              # tightening surface. The Name parameter is constrained by
              # the LEGACY_TO_TYPED map inside the handler.
              Action: secretsmanager:CreateSecret
              Resource: "*"
            - Sid: MigrateCredentialsPutMetric
              Effect: Allow
              Action: cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace: Workforce/Credentials
      Tags:
        workforce: !Ref Stage

  WfSeedAgentsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub wf-seed-agents-errors-alarm-${Stage}
      AlarmDescription: !Sub Errors > 0 on wf-seed-agents-${Stage} over 5 minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WfSeedAgentsFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref WfAlarmTopic

  # --- Skills seed Lambda (Epic-008 PR-D) ------------------------------------
  # Mirror of WfSeedAgentsFunction for the skill repository. Reads
  # workforce/skills/{name}/{SKILL.md, meta.json} from the deployed bundle
  # (Makefile builder copies the tree) and upserts SKILL#{name}/META rows.
  # Identity_hash gates idempotency; operational fields preserved on re-seed.
  WfSeedSkillsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub wf-seed-skills-${Stage}
      CodeUri: ../../lambdas/seed-skills
      Handler: handler.handler
      Description: Workforce skill seed. Files -> DDB SKILL#{name}/META. See Epic-008 PR-D.
      MemorySize: 512
      Timeout: 60
      Policies:
        - Statement:
            - Sid: SeedSkillsTableAccess
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource:
                - !GetAtt WfTable.Arn
      Events:
        PostDeploy:
          # Mirror of WfSeedAgentsFunction.Events.PostDeploy. Fires on
          # CREATE_COMPLETE / UPDATE_COMPLETE of this stack.
          Type: EventBridgeRule
          Properties:
            RuleName: !Sub wf-seed-skills-postdeploy-${Stage}
            Pattern:
              source:
                - aws.cloudformation
              detail-type:
                - CloudFormation Stack Status Change
              detail:
                stack-id:
                  - prefix: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/wf-data-plane-${Stage}/
                status-details:
                  status:
                    - CREATE_COMPLETE
                    - UPDATE_COMPLETE
      Tags:
        workforce: !Ref Stage

  WfSeedSkillsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub wf-seed-skills-errors-alarm-${Stage}
      AlarmDescription: !Sub Errors > 0 on wf-seed-skills-${Stage} over 5 minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WfSeedSkillsFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref WfAlarmTopic

  # --- Orchestrator Lambda + tick rule (PR6c, Epic-006 S1) -------------------
  # One EventBridge rule fires every 2 hours. The orchestrator scans all
  # AGENT#*/META rows, evaluates each agent's schedule_cron against the
  # 120-minute window, and fires the CCR /fire routine for the bindings that
  # match (ADR-0005). No per-agent CFN rules — workforce scales by adding
  # data rows, not template resources.
  #
  # The window MUST equal the tick interval (120m) so consecutive past-facing
  # windows are contiguous — no gaps that would silently drop a cron fire.
  # Trade-off of the 2-hourly tick: any binding whose cron is finer than 2h
  # collapses to one dispatch per tick, i.e. an effective 2-hourly cadence.
  # Accepted per operator decision.
  WfOrchestratorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub wf-orchestrator-${Stage}
      CodeUri: ../../lambdas/orchestrator
      Handler: handler.handler
      Description: Workforce dispatcher. Reads cron from DDB, fires CCR routines.
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          TICK_WINDOW_MINUTES: "120"
          ENGINEER_SLUG: ren
          ENGINEER_OWNER: !Ref EngineerOwner
          ENGINEER_REPO: !Ref EngineerRepo
          ENGINEER_TIMEOUT_MIN: "1440"
      Policies:
        - Statement:
            - Sid: OrchestratorDdbAccess
              Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource: !GetAtt WfTable.Arn
            - Sid: OrchestratorGithubSecret
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wf/github-*
            - Sid: OrchestratorCcrFireSecrets
              # CCR /fire dispatch path (shared/ccr-fire.ts). The orchestrator
              # loads `wf/ccr/{routine_id}` to get the routine's URL + bearer
              # token, then POSTs the fire payload. Scope is `wf/ccr/*`
              # only — the broader `wf/*` namespace stays out of reach.
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wf/ccr/*
            # ADR-0005 item 5: the orchestrator mints a short-lived engagement-
            # write token into DynamoDB (AUTH#ENGAGEMENT row) per fire — that's
            # the OrchestratorDdbAccess UpdateItem grant above, no Secrets
            # Manager token needed.
            - Sid: OrchestratorProjectCredentials
              # PR β: orchestrator-tick resolves a CCR task's project
              # credentials inline (per skill `requires[]`) and ships
              # them in the /fire payload. CCR itself never reads SM.
              # Scope is `wf/projects/*` to mirror the credential bag
              # naming (Epic-010 §6).
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wf/projects/*
      Events:
        Tick:
          Type: Schedule
          Properties:
            Name: !Sub wf-orchestrator-tick-${Stage}
            Description: Drives the workforce dispatch loop every 2 hours.
            Schedule: rate(2 hours)
            Enabled: true
      Tags:
        workforce: !Ref Stage

  WfOrchestratorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub wf-orchestrator-errors-alarm-${Stage}
      AlarmDescription: !Sub Errors > 0 on wf-orchestrator-${Stage} over 5 minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WfOrchestratorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref WfAlarmTopic

  # --- Audit Lambda + tick rule (FU-021, Issue #146) -------------------------
  # Daily cron-fired sweep over the last 24h of EXEC + RUN rows for three
  # signal classes that gate Epic-010's `Status: Implemented` flip (ROADMAP
  # §Status-transition criterion 4): truncated executions, orphan exec/run
  # rows (dual-write witness gap), cross-project leakage. Emits one metric
  # per signal in the Workforce/Audit namespace; the alarms below page
  # WfAlarmTopic on any non-zero count over the daily window.
  #
  # Standalone Lambda (not a skill) — see handler.ts header for the
  # architectural deviation rationale (skills go through agent-runner,
  # which itself does the dual-write we audit).
  WfAuditFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub wf-audit-${Stage}
      CodeUri: ../../lambdas/audit
      Handler: handler.handler
      Description: Daily workforce audit — truncation / orphan-row / cross-project leak signals. FU-021.
      MemorySize: 512
      Timeout: 120
      Policies:
        - Statement:
            - Sid: AuditTableScan
              Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !GetAtt WfTable.Arn
            - Sid: AuditPutMetric
              # Three audit metrics emit under Workforce/Audit. Namespace-
              # conditioned per the same pattern as the runner / backfill /
              # credentials / agents-api metric grants.
              Effect: Allow
              Action: cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace: Workforce/Audit
      Events:
        DailyTick:
          Type: Schedule
          Properties:
            Name: !Sub wf-audit-tick-${Stage}
            Description: Drives the daily workforce audit sweep.
            # 04:00 UTC = 13:00 JST — low workforce traffic per the operator
            # cadence (orchestrator + most agent bindings run during JST
            # daytime / overnight, leaving 04:00 UTC quiet).
            Schedule: cron(0 4 * * ? *)
            Enabled: true
      Tags:
        workforce: !Ref Stage

  WfAuditErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub wf-audit-errors-alarm-${Stage}
      AlarmDescription: !Sub Errors > 0 on wf-audit-${Stage} over 5 minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WfAuditFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref WfAlarmTopic

  # Three signal alarms — any non-zero count over a 24h evaluation window
  # fires the existing SNS topic. The 24h Period matches the cron cadence;
  # one alarm event per problem-day rather than per-15-minute noise.
  # TreatMissingData: notBreaching covers the cold-start window (no metric
  # data yet means audit hasn't fired; not an alarm condition).
  WfAuditTruncatedExecsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub wf-audit-truncated-execs-alarm-${Stage}
      AlarmDescription: !Sub Audit found truncated EXEC rows in wf-table-${Stage} (Epic-010 C-1 risk).
      Namespace: Workforce/Audit
      MetricName: WfAuditTruncatedExecs
      Dimensions:
        - Name: Stage
          Value: !Ref Stage
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref WfAlarmTopic

  # Epic-010 C2 cutover: WfAuditOrphanExecsAlarm removed — see
  # workforce/lambdas/audit/handler.ts header for rationale (post-C2
  # the metric was universal noise: success paths write EXEC only,
  # failure paths write RUN only, neither has a sibling).

  WfAuditCrossProjectLeaksAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub wf-audit-cross-project-leaks-alarm-${Stage}
      AlarmDescription: !Sub Audit found cross-project leakage in wf-table-${Stage} (Epic-010 W-2 trust-boundary breach).
      Namespace: Workforce/Audit
      MetricName: WfAuditCrossProjectLeaks
      Dimensions:
        - Name: Stage
          Value: !Ref Stage
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref WfAlarmTopic

  # --- Memory compactor Lambda (Epic-012 Story 2) ---------------------------
  # Nightly sweep that folds each agent's accumulated run chunks into a
  # rolling long-term-memory summary. One summariser LLM call per compacting
  # agent. Modelled on wf-audit (standalone scheduled Lambda, not a skill).
  WfMemoryCompactorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub wf-memory-compactor-${Stage}
      CodeUri: ../../lambdas/memory-compactor
      Handler: handler.handler
      Description: Nightly memory compaction — rolling long-term-memory summary per agent. Epic-012 Story 2.
      MemorySize: 512
      Timeout: 300
      Policies:
        - Statement:
            - Sid: CompactorTableRw
              Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt WfTable.Arn
            - Sid: CompactorMemoryS3Rw
              # Reads run chunks + prior summary, writes the new summary chunk.
              # Scoped to memory/* — the only prefix this Lambda touches.
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - !Sub ${WfBucket.Arn}/memory/*
            - Sid: CompactorAnthropicRead
              # The summariser model key. wf/anthropic is the legacy bare key
              # complete() reads (shared/llm-anthropic.ts); kept until the
              # Epic-010 §6 bare-key deletion lands.
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:wf/anthropic-*
            - Sid: CompactorPutMetric
              Effect: Allow
              Action: cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace: Workforce/Memory
      Events:
        NightlyTick:
          Type: Schedule
          Properties:
            Name: !Sub wf-memory-compactor-tick-${Stage}
            Description: Drives the nightly memory-compaction sweep.
            # 05:00 UTC = 14:00 JST — one hour after wf-audit, same quiet
            # window; compaction reads the same table the audit just swept.
            Schedule: cron(0 5 * * ? *)
            Enabled: true
      Tags:
        workforce: !Ref Stage

  WfMemoryCompactorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub wf-memory-compactor-errors-alarm-${Stage}
      AlarmDescription: !Sub The wf-memory-compactor-${Stage} Lambda is erroring.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WfMemoryCompactorFunction
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref WfAlarmTopic

  WfMemoryCompactionIdentityLossAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub wf-memory-compaction-identity-loss-alarm-${Stage}
      AlarmDescription: !Sub Compaction dropped an agent identity fact in wf-table-${Stage} (Epic-012 persona-integrity breach).
      Namespace: Workforce/Memory
      MetricName: WfMemoryCompactionIdentityLoss
      Dimensions:
        - Name: Stage
          Value: !Ref Stage
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref WfAlarmTopic

  # --- Epic-010 observability dashboard (FU-NEW-A, Issue #150 B6) -------------
  # Single CloudWatch Dashboard surfacing every metric Epic-010 introduced:
  #
  #   Workforce/Credentials  WfLegacyCredentialReads          (split by Reason
  #                                                            — fallback_bare
  #                                                            graphs to zero
  #                                                            before the C1
  #                                                            bare-key deletion
  #                                                            PR ships).
  #                          WfCredentialsMigrated / *AlreadyMigrated /
  #                          *SourceMissing / *MigrationErrors
  #
  #   Workforce/Recall       WfExecEmbeddingFailed            (operator's
  #                                                            signal that
  #                                                            the embedding
  #                                                            retry queue
  #                                                            has work).
  #
  #   Workforce/Runner       WfExecDualWriteFailed            (Story 1-B
  #                                                            dual-write
  #                                                            integrity).
  #
  #   Workforce/AgentsApi    WfMalformedProjectMeta           (FU-NEW-D —
  #                                                            listProjects
  #                                                            skip count;
  #                                                            target 0).
  #
  # The dashboard is a thin layer over PutMetricData — no IAM additions
  # required. Per-region, per-stage so the operator can flip stages via
  # the AWS console picker.
  WfEpic010Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub wf-epic-010-${Stage}
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0, "y": 0, "width": 24, "height": 2,
              "properties": {
                "markdown": "# Workforce / Epic-010 (${Stage})\n\nSurfaces every metric Epic-010 introduced. **Target state**: `WfLegacyCredentialReads{Reason=fallback_bare}` and `WfMalformedProjectMeta` graph to zero. `WfExecDualWriteFailed` stays at zero. `WfExecEmbeddingFailed` reflects pending retry-queue depth."
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 2, "width": 12, "height": 6,
              "properties": {
                "title": "Workforce/Credentials — WfLegacyCredentialReads (by Reason)",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  [ "Workforce/Credentials", "WfLegacyCredentialReads", "Stage", "${Stage}", "Reason", "fallback_default" ],
                  [ ".", ".", ".", ".", "Reason", "fallback_bare", { "color": "#d62728" } ]
                ],
                "yAxis": { "left": { "min": 0 } },
                "annotations": {
                  "horizontal": [
                    { "label": "fallback_bare target (deletion gate)", "value": 0, "color": "#d62728" }
                  ]
                }
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 2, "width": 12, "height": 6,
              "properties": {
                "title": "Workforce/AgentsApi — WfMalformedProjectMeta",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  [ "Workforce/AgentsApi", "WfMalformedProjectMeta", "Stage", "${Stage}", { "color": "#d62728" } ]
                ],
                "yAxis": { "left": { "min": 0 } },
                "annotations": {
                  "horizontal": [
                    { "label": "target (clean)", "value": 0, "color": "#d62728" }
                  ]
                }
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 8, "width": 12, "height": 6,
              "properties": {
                "title": "Workforce/Credentials — Migration outcomes",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  [ "Workforce/Credentials", "WfCredentialsMigrated",        "Stage", "${Stage}" ],
                  [ ".",                     "WfCredentialsAlreadyMigrated", ".",     "." ],
                  [ ".",                     "WfCredentialsSourceMissing",   ".",     "." ],
                  [ ".",                     "WfCredentialsMigrationErrors", ".",     ".", { "color": "#d62728" } ]
                ],
                "yAxis": { "left": { "min": 0 } }
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 8, "width": 12, "height": 6,
              "properties": {
                "title": "Workforce/Recall — WfExecEmbeddingFailed (pending-queue depth signal)",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  [ "Workforce/Recall", "WfExecEmbeddingFailed", "Stage", "${Stage}" ]
                ],
                "yAxis": { "left": { "min": 0 } }
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 14, "width": 24, "height": 6,
              "properties": {
                "title": "Workforce/Runner — WfExecDualWriteFailed (by Reason)",
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  [ { "expression": "SEARCH('{Workforce/Runner,Stage,Reason} MetricName=\"WfExecDualWriteFailed\" Stage=\"${Stage}\"', 'Sum', 300)", "label": "dual-write failures", "id": "dwf" } ]
                ],
                "yAxis": { "left": { "min": 0 } },
                "annotations": {
                  "horizontal": [
                    { "label": "target (no dual-write drift)", "value": 0, "color": "#d62728" }
                  ]
                }
              }
            },
            {
              "type": "text",
              "x": 0, "y": 20, "width": 24, "height": 2,
              "properties": {
                "markdown": "## Daily audit (FU-021)\n\nThe daily 04:00 UTC audit sweep emits one metric per signal. Each is gated by the corresponding alarm (`wf-audit-*-alarm-${Stage}`). **Status-transition criterion 4** flips green once all three stay at zero for ≥ 7 consecutive days. SUM over 24h matches the cron cadence — one alarm event per problem-day, not per-15-minute noise."
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 22, "width": 8, "height": 6,
              "properties": {
                "title": "Workforce/Audit — WfAuditTruncatedExecs (daily)",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 86400,
                "stat": "Sum",
                "metrics": [
                  [ "Workforce/Audit", "WfAuditTruncatedExecs", "Stage", "${Stage}", { "color": "#d62728" } ]
                ],
                "yAxis": { "left": { "min": 0 } },
                "annotations": {
                  "horizontal": [
                    { "label": "target (clean — C-1 risk-free)", "value": 0, "color": "#d62728" }
                  ]
                }
              }
            },
            {
              "type": "metric",
              "x": 8, "y": 22, "width": 16, "height": 6,
              "properties": {
                "title": "Workforce/Audit — WfAuditCrossProjectLeaks (daily)",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 86400,
                "stat": "Sum",
                "metrics": [
                  [ "Workforce/Audit", "WfAuditCrossProjectLeaks", "Stage", "${Stage}", { "color": "#d62728" } ]
                ],
                "yAxis": { "left": { "min": 0 } },
                "annotations": {
                  "horizontal": [
                    { "label": "target (clean — W-2 boundary intact)", "value": 0, "color": "#d62728" }
                  ]
                }
              }
            }
          ]
        }


Outputs:
  TableName:
    Description: DynamoDB table name (consumed by PR5/PR6 Lambdas).
    Value: !Ref WfTable
    Export:
      Name: !Sub wf-table-name-${Stage}
  # Epic-013 Story 2 messaging writes reuse the existing workforce operator
  # login (infra/sam-web Cognito user pool + Identity Pool); no messaging-
  # specific Cognito outputs are needed. The SPA already has its login env.
  TableArn:
    Value: !GetAtt WfTable.Arn
    Export:
      Name: !Sub wf-table-arn-${Stage}
  BucketName:
    Description: S3 bucket name (consumed by PR5/PR6 Lambdas).
    Value: !Ref WfBucket
    Export:
      Name: !Sub wf-bucket-name-${Stage}
  AlarmTopicArn:
    Description: SNS topic that receives all stack alarms.
    Value: !Ref WfAlarmTopic
    Export:
      Name: !Sub wf-alarm-topic-arn-${Stage}
  AgentsApiUrl:
    # Includes the stage path so the value is directly usable as the SPA's
    # API base (the console deploy reads this output into
    # VITE_WORKFORCE_AGENTS_API_BASE). HTTP API invoke URLs are
    # https://{id}.execute-api.{region}.amazonaws.com/{stage} — omitting
    # /{stage} yields a 404 with no CORS headers, which the browser
    # surfaces as an opaque "Failed to fetch".
    Description: Base URL of the agents HTTP API, including the stage path.
    Value: !Sub https://${WfAgentsHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
    Export:
      Name: !Sub wf-agents-api-url-${Stage}
  AgentsApiId:
    # Folded scalar: backticks + `execute-api:Invoke` colon would otherwise
    # break the YAML plain-scalar continuation (sam build refused to parse
    # the template between PR #163 and this fix).
    Description: >-
      ID of the agents HTTP API. Consumed by sam-web's
      Identity Pool operator role (Issue #158 PR-α) to scope
      `execute-api:Invoke` to this API only.
    Value: !Ref WfAgentsHttpApi
    Export:
      Name: !Sub wf-agents-api-id-${Stage}
  CredentialsApiUrl:
    # Includes the stage path — see AgentsApiUrl. Read into
    # VITE_WORKFORCE_CREDENTIALS_API_BASE by the console deploy.
    Description: Base URL of the credentials write HTTP API (incl. stage path). All routes are AWS_IAM-authorised (operator only).
    Value: !Sub https://${WfCredentialsHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
    Export:
      Name: !Sub wf-credentials-api-url-${Stage}
  CredentialsApiId:
    # Folded scalar — see AgentsApiId for rationale.
    Description: >-
      ID of the credentials HTTP API. Consumed by sam-web's
      Identity Pool operator role (Issue #158 PR-α) to scope
      `execute-api:Invoke` to this API only.
    Value: !Ref WfCredentialsHttpApi
    Export:
      Name: !Sub wf-credentials-api-id-${Stage}
  Epic010DashboardName:
    Description: CloudWatch Dashboard surfacing every Epic-010 metric (FU-NEW-A).
    Value: !Ref WfEpic010Dashboard
    Export:
      Name: !Sub wf-epic-010-dashboard-name-${Stage}
