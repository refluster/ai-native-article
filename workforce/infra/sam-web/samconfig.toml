version = 0.1

# Workforce console hosting + auth stack. ap-northeast-1, same account
# as wf-data-plane-prod. The us-east-1 ACM cert lives in a sibling
# stack (wf-web-cert-prod) — see workforce/infra/sam-web-cert/.
#
# Three parameters MUST be supplied at deploy time (no defaults):
#   - CertificateArn       — output of wf-web-cert-prod
#   - GoogleClientId       — Google OAuth client created in Cloud Console
#   - GoogleClientSecret   — pair with GoogleClientId
#   - OperatorEmail        — single email the pre-sign-up Lambda allows
#
# Example:
#   sam deploy \
#     --parameter-overrides \
#       CertificateArn=arn:aws:acm:us-east-1:...:certificate/... \
#       GoogleClientId=...apps.googleusercontent.com \
#       GoogleClientSecret=GOCSPX-... \
#       OperatorEmail=refluster@gmail.com

[default.global.parameters]
stack_name = "wf-web-prod"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
region = "ap-northeast-1"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = true
fail_on_empty_changeset = false
resolve_s3 = true
