<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Cognitive Guildを取り巻くシリコンバレーのソフトウェア・AI集積</title>
  <desc id="desc">サンフランシスコ、ベイエリア、シリコンバレーにある主要なテクノロジー企業と研究機関を示す概略地図。Cognitive Guildの位置を中心に、OpenAI、Anthropic、Salesforce、Airbnb、Uber、Y Combinator、Meta、Stanford University、Tesla、XとxAI、Google、Apple、NVIDIA、Adobeの主要拠点を示している。</desc>
  <style>
    :root{--bg:#f7f8fa;--land:#fff;--water:#e8edf3;--ink:#151b23;--muted:#64707d;--line:#cbd3dc;--road:#aeb8c3;--accent:#2447d8;--accent-soft:#e8edff;--panel:#fff}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1218;--land:#151c24;--water:#202b36;--ink:#eef2f6;--muted:#a5afba;--line:#38434f;--road:#667380;--accent:#9db0ff;--accent-soft:#1c2745;--panel:#151c24}}
    text{font-family:"Source Sans 3","Noto Sans JP",system-ui,sans-serif;fill:var(--ink)}
    .eyebrow{font:600 13px "IBM Plex Mono",monospace;letter-spacing:.16em;fill:var(--accent)}
    .heading{font-size:30px;font-weight:700;letter-spacing:-.02em}
    .sub{font-size:15px;fill:var(--muted)}
    .city{font-size:13px;font-weight:600;fill:var(--muted);letter-spacing:.03em}
    .bay{font-size:12px;fill:var(--muted);letter-spacing:.18em}
    .company{font-size:14px;font-weight:700}
    .detail{font-size:11.5px;fill:var(--muted)}
    .small{font-size:11px;fill:var(--muted)}
    .road{fill:none;stroke:var(--road);stroke-width:2;stroke-dasharray:5 6;opacity:.8}
    .shore{fill:var(--water);stroke:var(--line);stroke-width:1.5}
    .county{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 7;opacity:.7}
    .leader{fill:none;stroke:var(--line);stroke-width:1.2}
    .pin{fill:var(--panel);stroke:var(--ink);stroke-width:1.8}
    .pin-core{fill:var(--ink)}
    .guild-pin{fill:var(--accent);stroke:var(--panel);stroke-width:4}
    .guild-ring{fill:none;stroke:var(--accent);stroke-width:2;opacity:.35}
    .label{fill:var(--panel);stroke:var(--line);stroke-width:1}
    .sf-panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
  </style>

  <rect width="1200" height="820" fill="var(--bg)"/>
  <text x="54" y="48" class="eyebrow">BUILT IN SILICON VALLEY</text>
  <text x="54" y="84" class="heading">世界のソフトウェア生産を変えてきた場所で</text>
  <text x="54" y="111" class="sub">San FranciscoのAI・SaaS集積から、Peninsulaの研究・製品開発拠点までが、一つの経済圏としてつながっています。</text>

  <g transform="translate(42 140)">
    <rect x="0" y="0" width="1116" height="620" rx="10" fill="var(--land)" stroke="var(--line)"/>

    <!-- Simplified San Francisco Bay shoreline; the diagram emphasizes relative proximity rather than street-level navigation. -->
    <path class="shore" d="M0 16H136c28 15 38 38 34 66-5 35 5 62 39 83 34 22 52 51 49 88-4 53 22 87 79 106 62 20 107 58 136 113 20 38 49 58 87 59 52 1 91-20 117-63 26-43 52-91 77-145 29-61 69-103 120-126 46-21 88-57 126-108 23-30 55-54 96-73h20V0H0Z"/>
    <path class="shore" d="M160 0c-3 31 7 56 31 75 29 23 45 49 48 80 3 36 19 62 48 78 28 16 50 38 66 68 16 31 40 47 71 48 30 1 51-13 63-42 17-40 28-82 35-126 8-48 29-88 64-119 26-23 51-44 75-62Z" opacity=".92"/>
    <text x="310" y="221" class="bay" transform="rotate(28 310 221)">SAN FRANCISCO BAY</text>

    <!-- Regional guides -->
    <path class="road" d="M175 102C225 178 286 255 370 333S535 476 702 526"/>
    <path class="road" d="M205 120C284 183 357 244 419 312S555 439 729 505" opacity=".55"/>
    <path class="road" d="M356 176C439 236 527 318 604 418S698 530 781 565"/>
    <text x="331" y="284" class="small" transform="rotate(43 331 284)">US 101</text>
    <text x="488" y="378" class="small" transform="rotate(48 488 378)">I-280</text>
    <text x="663" y="368" class="small" transform="rotate(63 663 368)">I-880</text>

    <path class="county" d="M295 270L402 353L495 442L589 513"/>
    <text x="170" y="139" class="city">SAN FRANCISCO</text>
    <text x="407" y="328" class="city">MENLO PARK</text>
    <text x="442" y="372" class="city">PALO ALTO</text>
    <text x="516" y="421" class="city">MOUNTAIN VIEW</text>
    <text x="569" y="493" class="city">CUPERTINO</text>
    <text x="666" y="517" class="city">SANTA CLARA</text>
    <text x="742" y="573" class="city">SAN JOSE</text>

    <!-- San Francisco cluster -->
    <circle cx="179" cy="160" r="9" class="pin"/><circle cx="179" cy="160" r="3" class="pin-core"/>
    <path d="M179 160C118 188 86 216 84 254" class="leader"/>
    <g transform="translate(34 250)">
      <rect width="250" height="232" rx="8" class="sf-panel"/>
      <text x="18" y="29" class="eyebrow">SAN FRANCISCO</text>
      <line x1="18" y1="43" x2="232" y2="43" stroke="var(--line)"/>
      <g transform="translate(18 67)"><circle r="4" class="pin-core"/><text x="14" y="5" class="company">OpenAI</text><text x="137" y="5" class="detail">Mission Bay</text></g>
      <g transform="translate(18 94)"><circle r="4" class="pin-core"/><text x="14" y="5" class="company">Anthropic</text><text x="137" y="5" class="detail">SoMa</text></g>
      <g transform="translate(18 121)"><circle r="4" class="pin-core"/><text x="14" y="5" class="company">Salesforce</text><text x="137" y="5" class="detail">Downtown</text></g>
      <g transform="translate(18 148)"><circle r="4" class="pin-core"/><text x="14" y="5" class="company">Uber</text><text x="137" y="5" class="detail">Mission Bay</text></g>
      <g transform="translate(18 175)"><circle r="4" class="pin-core"/><text x="14" y="5" class="company">Airbnb</text><text x="137" y="5" class="detail">SoMa</text></g>
      <g transform="translate(18 202)"><circle r="4" class="pin-core"/><text x="14" y="5" class="company">Y Combinator</text><text x="137" y="5" class="detail">SF</text></g>
    </g>

    <!-- Peninsula and South Bay anchors -->
    <g transform="translate(420 344)">
      <circle r="9" class="pin"/><circle r="3" class="pin-core"/>
      <rect x="15" y="-19" width="103" height="39" rx="5" class="label"/>
      <text x="27" y="-2" class="company">Meta</text><text x="27" y="13" class="detail">Menlo Park</text>
    </g>

    <g transform="translate(468 390)">
      <circle r="9" class="pin"/><circle r="3" class="pin-core"/>
      <rect x="15" y="-48" width="176" height="68" rx="5" class="label"/>
      <text x="27" y="-27" class="company">Stanford University</text><text x="27" y="-9" class="detail">Stanford</text>
      <text x="27" y="10" class="company">Tesla · X / xAI</text>
    </g>

    <g transform="translate(536 435)">
      <circle r="9" class="pin"/><circle r="3" class="pin-core"/>
      <rect x="15" y="-20" width="142" height="42" rx="5" class="label"/>
      <text x="27" y="-2" class="company">Google</text><text x="27" y="14" class="detail">Mountain View</text>
    </g>

    <g transform="translate(595 506)">
      <circle r="9" class="pin"/><circle r="3" class="pin-core"/>
      <rect x="15" y="-20" width="122" height="42" rx="5" class="label"/>
      <text x="27" y="-2" class="company">Apple</text><text x="27" y="14" class="detail">Cupertino</text>
    </g>

    <g transform="translate(678 532)">
      <circle r="9" class="pin"/><circle r="3" class="pin-core"/>
      <rect x="15" y="-20" width="136" height="42" rx="5" class="label"/>
      <text x="27" y="-2" class="company">NVIDIA</text><text x="27" y="14" class="detail">Santa Clara</text>
    </g>

    <g transform="translate(761 580)">
      <circle r="9" class="pin"/><circle r="3" class="pin-core"/>
      <rect x="15" y="-43" width="126" height="42" rx="5" class="label"/>
      <text x="27" y="-25" class="company">Adobe</text><text x="27" y="-9" class="detail">San Jose</text>
    </g>

    <!-- Cognitive Guild -->
    <g transform="translate(560 401)">
      <circle r="28" class="guild-ring"/><circle r="17" class="guild-pin"/>
      <path d="M-6 0H6M0-6V6" stroke="white" stroke-width="2"/>
      <rect x="35" y="-42" width="280" height="82" rx="7" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
      <text x="53" y="-14" class="eyebrow">COGNITIVE GUILD</text>
      <text x="53" y="12" class="company">Built in Silicon Valley</text>
      <text x="53" y="30" class="detail">Bay Area, California</text>
    </g>

    <g transform="translate(1019 34)">
      <path d="M0 34V0l-9 14h18Z" fill="var(--ink)"/><text x="0" y="51" text-anchor="middle" class="small">N</text>
    </g>
    <text x="854" y="595" class="small">Conceptual map · locations are representative</text>
  </g>

  <text x="54" y="790" class="small">Major Bay Area campuses and offices, September 2026. X is shown by its Bay Area engineering presence; its corporate headquarters is outside California.</text>
</svg>
