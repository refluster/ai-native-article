<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Cognitive Guildとシリコンバレーの主要テクノロジー拠点</title>
  <desc id="desc">サンフランシスコ湾岸の概略地図。Cognitive Guildの拠点と、OpenAI、Anthropic、Salesforce、Uber、Airbnb、Y Combinator、Meta、Stanford University、Tesla、XとxAI、Google、Apple、NVIDIA、Adobeの主要拠点を番号付きで示す。</desc>
  <style>

    text{font-family:"Source Sans 3","Noto Sans JP",system-ui,sans-serif;fill:#161b22}
    .eyebrow{font:600 13px "IBM Plex Mono",monospace;letter-spacing:.17em;fill:#2c3642}
    .title{font-size:30px;font-weight:700;letter-spacing:-.02em}.subtitle{font-size:15px;fill:#687480}
    .region{font:600 12px "IBM Plex Mono",monospace;letter-spacing:.16em;fill:#687480}
    .city{font-size:11px;font-weight:600;fill:#687480;letter-spacing:.04em}
    .water-name{font:500 11px "IBM Plex Mono",monospace;letter-spacing:.2em;fill:#687480}
    .group{font:600 11px "IBM Plex Mono",monospace;letter-spacing:.13em;fill:#2c3642}
    .company{font-size:14px;font-weight:700}.place{font-size:11.5px;fill:#687480}.note{font-size:11px;fill:#687480}
    .land{fill:#ffffff;stroke:#c8d0d9;stroke-width:1.4;stroke-linejoin:round}
    .county{fill:none;stroke:#c8d0d9;stroke-width:1;stroke-dasharray:4 7;opacity:.8}
    .route{fill:none;stroke:#9ba6b2;stroke-width:1.6;stroke-dasharray:5 5;opacity:.75}
    .leader{fill:none;stroke:#c8d0d9;stroke-width:1.1}
    .pin circle:first-child{fill:#ffffff;stroke:#161b22;stroke-width:1.5}
    .pin text{font:700 10px "IBM Plex Mono",monospace;text-anchor:middle;dominant-baseline:central}
    .list-number{fill:#ffffff;stroke:#161b22;stroke-width:1.3}
    .list-digit{font:700 10px "IBM Plex Mono",monospace;text-anchor:middle;dominant-baseline:central}
    .card{fill:#ffffff;stroke:#c8d0d9;stroke-width:1.1}
    .guild{fill:#161b22;stroke:#ffffff;stroke-width:3}.guild-ring{fill:none;stroke:#161b22;stroke-width:1.5;opacity:.28}
  </style>
