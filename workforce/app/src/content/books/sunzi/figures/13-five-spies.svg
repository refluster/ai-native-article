<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="f13-title f13-desc" class="f13">
  <title id="f13-title">図15 五間の関係 — 反間が四間を動かす</title>
  <desc id="f13-desc">用間篇の五間。中心の反間（敵の間者を寝返らせる）から得た知によって、郷間・内間を使い、死間に偽りを告げさせ、生間を期の如く帰らせる。先知は鬼神からではなく、必ず人から取る。</desc>
  <style>
    .f13 text{font-family:inherit}
    .f13-tag{font-size:15px;font-weight:600;fill:var(--book-ink)}
    .f13-c{font-size:28px;font-weight:700;fill:var(--book-ink)}
    .f13-n{font-size:22px;font-weight:700;fill:var(--book-ink)}
    .f13-s{font-size:14px;fill:var(--book-ink-2)}
    .f13-o{font-size:13px;fill:var(--book-ink-2)}
    .f13-n2{font-size:15px;fill:var(--book-ink-2)}
    .f13-box{fill:var(--book-panel);stroke:var(--book-line);stroke-width:1.2}
    .f13-core{fill:var(--book-panel);stroke:var(--book-accent);stroke-width:2}
    .f13-tagbox{fill:var(--book-bg);stroke:var(--book-line);stroke-width:1.2}
    .f13-arr{fill:none;stroke:var(--book-accent);stroke-width:1.6;marker-end:url(#fig13-aha)}
    .f13-up{fill:none;stroke:var(--book-ink-2);stroke-width:1.3;stroke-dasharray:4 4;marker-end:url(#fig13-ah)}
    .f13-ahp{fill:var(--book-ink-2)}
    .f13-ahpa{fill:var(--book-accent)}
  </style>
  <defs>
    <marker id="fig13-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f13-ahp"/></marker>
    <marker id="fig13-aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f13-ahpa"/></marker>
  </defs>

  <!-- 先知 tag -->
  <rect x="270" y="34" width="180" height="40" rx="20" class="f13-tagbox"/>
  <text x="360" y="60" text-anchor="middle" class="f13-tag">先知は人に取る</text>
  <path d="M360 236 L360 82" class="f13-up"/>

  <!-- outer four -->
  <rect x="40" y="150" width="200" height="84" rx="6" class="f13-box"/>
  <text x="140" y="186" text-anchor="middle" class="f13-n">郷間</text>
  <text x="140" y="214" text-anchor="middle" class="f13-s">敵国の住民を使う</text>

  <rect x="480" y="150" width="200" height="84" rx="6" class="f13-box"/>
  <text x="580" y="186" text-anchor="middle" class="f13-n">内間</text>
  <text x="580" y="214" text-anchor="middle" class="f13-s">敵の官吏を使う</text>

  <rect x="40" y="410" width="200" height="84" rx="6" class="f13-box"/>
  <text x="140" y="446" text-anchor="middle" class="f13-n">死間</text>
  <text x="140" y="474" text-anchor="middle" class="f13-s">偽りを敵に流す</text>

  <rect x="480" y="410" width="200" height="84" rx="6" class="f13-box"/>
  <text x="580" y="446" text-anchor="middle" class="f13-n">生間</text>
  <text x="580" y="474" text-anchor="middle" class="f13-s">生きて戻り報告する</text>

  <!-- arrows from the core -->
  <path d="M293 273 L246 240" class="f13-arr"/>
  <path d="M427 273 L474 240" class="f13-arr"/>
  <path d="M293 367 L246 404" class="f13-arr"/>
  <path d="M427 367 L474 404" class="f13-arr"/>

  <!-- core -->
  <circle cx="360" cy="320" r="80" class="f13-core"/>
  <text x="360" y="312" text-anchor="middle" class="f13-c">反間</text>
  <text x="360" y="340" text-anchor="middle" class="f13-o">敵の間者を</text>
  <text x="360" y="358" text-anchor="middle" class="f13-o">寝返らせる</text>

  <text x="360" y="540" text-anchor="middle" class="f13-n2">反間を起点に四間が動く</text>
  <text x="360" y="564" text-anchor="middle" class="f13-o">反間不可不厚也</text>
</svg>
