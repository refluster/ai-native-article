<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" role="img" aria-labelledby="f16-title f16-desc" class="f16">
  <title id="f16-title">図18 五事七計のプロジェクト写像 — 始める前に勝算を数える</title>
  <desc id="f16-desc">道は目的と合意、天は時機と外部環境、地は市場・技術の地形、将は責任者、法は体制とルール。五つの軸を開始前の評価会（廟算）で七計のように比べ、勝算が立てば着手し、立たなければ撤退基準に従って去る。</desc>
  <style>
    .f16 text{font-family:inherit}
    .f16-h{font-size:14px;fill:var(--book-ink-2);letter-spacing:.08em}
    .f16-c{font-size:28px;font-weight:700;fill:var(--book-ink)}
    .f16-g{font-size:13px;fill:var(--book-ink-2)}
    .f16-t{font-size:19px;font-weight:700;fill:var(--book-ink)}
    .f16-s{font-size:14px;fill:var(--book-ink-2)}
    .f16-k{font-size:19px;font-weight:700;fill:var(--book-ink)}
    .f16-box{fill:var(--book-panel);stroke:var(--book-line);stroke-width:1.2}
    .f16-src{fill:var(--book-bg);stroke:var(--book-line);stroke-width:1.2}
    .f16-gate{fill:var(--book-panel);stroke:var(--book-accent);stroke-width:1.8}
    .f16-arr{fill:none;stroke:var(--book-ink-2);stroke-width:1.4;marker-end:url(#fig16-ah)}
    .f16-brk{fill:none;stroke:var(--book-ink-2);stroke-width:1.2}
    .f16-ahp{fill:var(--book-ink-2)}
  </style>
  <defs>
    <marker id="fig16-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f16-ahp"/></marker>
  </defs>

  <text x="125" y="40" text-anchor="middle" class="f16-h">五事（計篇）</text>
  <text x="485" y="40" text-anchor="middle" class="f16-h">プロジェクトでは</text>

  <!-- 道 -->
  <rect x="40" y="56" width="170" height="60" rx="6" class="f16-src"/>
  <text x="76" y="97" text-anchor="middle" class="f16-c">道</text>
  <text x="108" y="92" class="f16-g">民と上の同意</text>
  <path d="M216 86 L284 86" class="f16-arr"/>
  <rect x="290" y="56" width="390" height="60" rx="6" class="f16-box"/>
  <text x="312" y="93" class="f16-t">目的と合意</text>
  <text x="662" y="92" text-anchor="end" class="f16-s">同じ絵を見ているか</text>

  <!-- 天 -->
  <rect x="40" y="132" width="170" height="60" rx="6" class="f16-src"/>
  <text x="76" y="173" text-anchor="middle" class="f16-c">天</text>
  <text x="108" y="168" class="f16-g">時と気候</text>
  <path d="M216 162 L284 162" class="f16-arr"/>
  <rect x="290" y="132" width="390" height="60" rx="6" class="f16-box"/>
  <text x="312" y="169" class="f16-t">時機と外部環境</text>
  <text x="662" y="168" text-anchor="end" class="f16-s">今か、待つか</text>

  <!-- 地 -->
  <rect x="40" y="208" width="170" height="60" rx="6" class="f16-src"/>
  <text x="76" y="249" text-anchor="middle" class="f16-c">地</text>
  <text x="108" y="244" class="f16-g">遠近・険易</text>
  <path d="M216 238 L284 238" class="f16-arr"/>
  <rect x="290" y="208" width="390" height="60" rx="6" class="f16-box"/>
  <text x="312" y="245" class="f16-t">市場・技術の地形</text>
  <text x="662" y="244" text-anchor="end" class="f16-s">難しさと距離</text>

  <!-- 将 -->
  <rect x="40" y="284" width="170" height="60" rx="6" class="f16-src"/>
  <text x="76" y="325" text-anchor="middle" class="f16-c">将</text>
  <text x="108" y="320" class="f16-g">智信仁勇厳</text>
  <path d="M216 314 L284 314" class="f16-arr"/>
  <rect x="290" y="284" width="390" height="60" rx="6" class="f16-box"/>
  <text x="312" y="321" class="f16-t">責任者</text>
  <text x="662" y="320" text-anchor="end" class="f16-s">資質と判断</text>

  <!-- 法 -->
  <rect x="40" y="360" width="170" height="60" rx="6" class="f16-src"/>
  <text x="76" y="401" text-anchor="middle" class="f16-c">法</text>
  <text x="108" y="396" class="f16-g">編制と規律</text>
  <path d="M216 390 L284 390" class="f16-arr"/>
  <rect x="290" y="360" width="390" height="60" rx="6" class="f16-box"/>
  <text x="312" y="397" class="f16-t">体制とルール</text>
  <text x="662" y="396" text-anchor="end" class="f16-s">役割・権限・規律</text>

  <!-- gather into the review -->
  <path d="M40 436 L40 446 L680 446 L680 436" class="f16-brk"/>
  <path d="M360 446 L360 474" class="f16-arr"/>

  <rect x="150" y="480" width="420" height="72" rx="6" class="f16-gate"/>
  <text x="360" y="512" text-anchor="middle" class="f16-k">廟算＝開始前の評価会</text>
  <text x="360" y="538" text-anchor="middle" class="f16-s">七計で彼我を比べる</text>

  <path d="M290 556 L214 600" class="f16-arr"/>
  <path d="M430 556 L506 600" class="f16-arr"/>

  <rect x="80" y="606" width="250" height="64" rx="6" class="f16-box"/>
  <text x="205" y="634" text-anchor="middle" class="f16-t">着手する</text>
  <text x="205" y="656" text-anchor="middle" class="f16-s">勝算が立つ</text>

  <rect x="390" y="606" width="250" height="64" rx="6" class="f16-box"/>
  <text x="515" y="634" text-anchor="middle" class="f16-t">撤退基準</text>
  <text x="515" y="656" text-anchor="middle" class="f16-s">立たねば去る</text>
</svg>
