<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="f10-title f10-desc" class="f10">
  <title id="f10-title">図10 六地形と六敗 — 地は助け、敗は将の過ち</title>
  <desc id="f10-desc">地形篇の六地形（通・掛・支・隘・険・遠）と六敗（走・弛・陥・崩・乱・北）。六敗は天の災いではなく将の過ちである。</desc>
  <style>
    .f10 text{font-family:inherit}
    .f10-h{font-size:14px;fill:var(--book-ink-2);letter-spacing:.08em}
    .f10-c{font-size:32px;font-weight:700;fill:var(--book-ink)}
    .f10-c2{font-size:28px;font-weight:700;fill:var(--book-ink)}
    .f10-s{font-size:14px;fill:var(--book-ink-2)}
    .f10-g2{font-size:15px;fill:var(--book-ink)}
    .f10-k{font-size:22px;font-weight:700;fill:var(--book-ink)}
    .f10-o{font-size:13px;fill:var(--book-ink-2)}
    .f10-box{fill:var(--book-panel);stroke:var(--book-line);stroke-width:1.2}
    .f10-g{fill:none;stroke:var(--book-ink-2);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .f10-gd{fill:none;stroke:var(--book-ink-2);stroke-width:1.3;stroke-dasharray:3 4;stroke-linecap:round}
    .f10-gm{fill:none;stroke:var(--book-ink-2);stroke-width:1.5;marker-end:url(#fig10-ah)}
    .f10-gmd{fill:none;stroke:var(--book-ink-2);stroke-width:1.3;stroke-dasharray:3 4;marker-end:url(#fig10-ah)}
    .f10-pt{fill:var(--book-ink)}
    .f10-ahp{fill:var(--book-ink-2)}
    .f10-arr{fill:none;stroke:var(--book-line);stroke-width:1.4;marker-end:url(#fig10-ah)}
    .f10-end{fill:var(--book-panel);stroke:var(--book-accent);stroke-width:1.5}
    .f10-bar{fill:var(--book-accent)}
  </style>
  <defs>
    <marker id="fig10-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f10-ahp"/></marker>
  </defs>

  <text x="30" y="34" class="f10-h">六地形 — 地の道</text>

  <!-- 通 : open both ways -->
  <rect x="30" y="48" width="210" height="122" rx="6" class="f10-box"/>
  <text x="50" y="100" class="f10-c">通</text>
  <path d="M100 95 L210 95" class="f10-g"/>
  <circle cx="108" cy="85" r="4" class="f10-pt"/>
  <circle cx="202" cy="85" r="4" class="f10-pt"/>
  <path d="M120 78 L190 78" class="f10-gm"/>
  <path d="M190 70 L120 70" class="f10-gm"/>
  <text x="50" y="150" class="f10-s">往くも来るも易い</text>

  <!-- 掛 : easy down, hard back -->
  <rect x="255" y="48" width="210" height="122" rx="6" class="f10-box"/>
  <text x="275" y="100" class="f10-c">掛</text>
  <path d="M325 66 L345 66 L425 116 L445 116" class="f10-g"/>
  <circle cx="333" cy="60" r="4" class="f10-pt"/>
  <path d="M362 65 L418 100" class="f10-gm"/>
  <path d="M425 90 L369 55" class="f10-gmd"/>
  <text x="275" y="150" class="f10-s">往けるが返りにくい</text>

  <!-- 支 : two heights, a hollow between -->
  <rect x="480" y="48" width="210" height="122" rx="6" class="f10-box"/>
  <text x="500" y="100" class="f10-c">支</text>
  <path d="M545 80 L570 80 Q610 122 650 80 L675 80" class="f10-g"/>
  <circle cx="558" cy="74" r="4" class="f10-pt"/>
  <circle cx="662" cy="74" r="4" class="f10-pt"/>
  <text x="500" y="150" class="f10-s">先に出た方が不利</text>

  <!-- 隘 : narrow pass -->
  <rect x="30" y="184" width="210" height="122" rx="6" class="f10-box"/>
  <text x="50" y="236" class="f10-c">隘</text>
  <path d="M100 200 Q150 224 210 224" class="f10-g"/>
  <path d="M100 262 Q150 238 210 238" class="f10-g"/>
  <path d="M108 231 L200 231" class="f10-gm"/>
  <text x="50" y="286" class="f10-s">狭い口、先に満たす</text>

  <!-- 険 : steep height -->
  <rect x="255" y="184" width="210" height="122" rx="6" class="f10-box"/>
  <text x="275" y="236" class="f10-c">険</text>
  <path d="M322 262 L382 204 L442 262" class="f10-g"/>
  <circle cx="382" cy="196" r="4" class="f10-pt"/>
  <path d="M330 248 L366 213" class="f10-gmd"/>
  <text x="275" y="286" class="f10-s">高く険しい、先に占める</text>

  <!-- 遠 : far apart -->
  <rect x="480" y="184" width="210" height="122" rx="6" class="f10-box"/>
  <text x="500" y="236" class="f10-c">遠</text>
  <circle cx="555" cy="232" r="4" class="f10-pt"/>
  <circle cx="667" cy="232" r="4" class="f10-pt"/>
  <path d="M565 232 L657 232" class="f10-gd"/>
  <text x="500" y="286" class="f10-s">勢均しく挑みにくい</text>

  <path d="M360 318 L360 354" class="f10-arr"/>
  <text x="376" y="342" class="f10-o">地形は兵の助けなり</text>

  <text x="30" y="384" class="f10-h">六敗 — 敗の道</text>

  <rect x="30" y="398" width="210" height="70" rx="6" class="f10-box"/>
  <text x="48" y="444" class="f10-c2">走</text>
  <text x="90" y="439" class="f10-g2">一で十を撃つ</text>
  <rect x="255" y="398" width="210" height="70" rx="6" class="f10-box"/>
  <text x="273" y="444" class="f10-c2">弛</text>
  <text x="315" y="439" class="f10-g2">卒強く吏弱し</text>
  <rect x="480" y="398" width="210" height="70" rx="6" class="f10-box"/>
  <text x="498" y="444" class="f10-c2">陥</text>
  <text x="540" y="439" class="f10-g2">吏強く卒弱し</text>

  <rect x="30" y="480" width="210" height="70" rx="6" class="f10-box"/>
  <text x="48" y="526" class="f10-c2">崩</text>
  <text x="90" y="521" class="f10-g2">大吏怒りて服さず</text>
  <rect x="255" y="480" width="210" height="70" rx="6" class="f10-box"/>
  <text x="273" y="526" class="f10-c2">乱</text>
  <text x="315" y="521" class="f10-g2">将弱く教え不明</text>
  <rect x="480" y="480" width="210" height="70" rx="6" class="f10-box"/>
  <text x="498" y="526" class="f10-c2">北</text>
  <text x="540" y="521" class="f10-g2">敵を料れない</text>

  <!-- verdict -->
  <rect x="150" y="582" width="420" height="104" rx="6" class="f10-end"/>
  <rect x="152" y="590" width="4" height="88" class="f10-bar"/>
  <text x="360" y="616" text-anchor="middle" class="f10-k">天の災いに非ず</text>
  <text x="360" y="648" text-anchor="middle" class="f10-k">将の過ちなり</text>
  <text x="360" y="676" text-anchor="middle" class="f10-o">非天之災、將之過也</text>
</svg>
