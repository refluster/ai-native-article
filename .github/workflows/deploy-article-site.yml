name: Deploy article site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # New articles authored by the workforce article-level2/level3
  # cadences land in the Notion Articles DB; edits made directly in
  # Notion (category fixes via the normalize script, manual title
  # tweaks) likewise only surface when something pushes to main.
  # Without a scheduled run, a quiet day on the main branch means a
  # quiet day on the live site even if the Notion DB has changed, so
  # we rebuild from Notion three times a day at 15:17 / 21:17 / 03:17
  # JST. (The earlier rationale of dodging the GAS L2/L3/L4 batch
  # trigger windows no longer applies — the GAS pipeline was retired;
  # generation is the workforce cadences and publication is this
  # Notion→gh-pages build.)
  schedule:
    - cron: '17 6,12,18 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch articles from Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          # Unified Articles DB (created 2026-04-27). When unset, fetch-notion
          # falls back to the legacy L3 DB id (see scripts/fetch-notion.mjs).
          UNIFIED_DB_ID: ${{ secrets.UNIFIED_DB_ID }}
          # Bridge mode (Phase B in the rollout plan): when "true",
          # fetch-notion reads from BOTH the unified DB and the legacy L3 DB
          # and dedupes by slug. Used to prove parity post-migration; flip
          # to "false" (or remove the secret) once verified.
          FETCH_BRIDGE: ${{ secrets.FETCH_BRIDGE }}
        run: npm run fetch-notion

      - name: Corpus truncation gate (R-10)
        # C-1/C-4: a truncated body must not reach gh-pages. Runs on the
        # freshly-fetched local posts, before build. The runtime finish_reason
        # throw (R-3) guards generation; this guards the deploy itself.
        run: npm run check-truncation

      - name: Design-token lint
        run: npm run lint:tokens

      - name: Generate sitemap + robots
        run: npm run sitemap

      - name: Build agent manifest
        # Article-side AuthorChip reads /workforce-agents.json from its own
        # public/ dir, so the manifest must exist before vite build copies
        # public/* into the dist/ output. (The workforce app does this in its
        # own prebuild hook; we mirror it explicitly for the article-only
        # gh-pages deploy.)
        run: npm run build:agents

      - name: Build article app
        env:
          VITE_GA_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
          # Capture page → wf-l1-source-register Lambda. NON-secret base URL
          # (the bearer token is entered by the operator at runtime, never
          # built in). When unset the Capture page shows a config warning.
          VITE_L1_CAPTURE_ENDPOINT: ${{ secrets.L1_CAPTURE_ENDPOINT }}
        run: npm run build:article

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./newsletter/app/dist
          force_orphan: true
          cname: kohuehara.xyz

      # R-17 — did the thing we just published actually load?
      #
      # Every gate above this line inspects the *inputs* to the deploy. None of
      # them can see the one fact that made #606 a week-long blank page: whether
      # GitHub Pages serves this build from the path the build was compiled for.
      # That is a Settings-side fact, and the only way to learn it is to fetch
      # the site. Running it here means a base-path regression is caught minutes
      # after the deploy that caused it, instead of by the next daily run — or,
      # as happened with #606, by a reader (#619 review: Farah F1, Dario D3,
      # Rafael R1).
      #
      # The step is deliberately NOT continue-on-error: a deploy that publishes
      # an unloadable site must turn this run red (C-4). The daily run in
      # corpus-freshness.yml stays as the drift catcher for Settings-side
      # changes that no deploy touches. The retries absorb Pages propagation,
      # and the script exits 2 — distinct from its exit 1 — when the network,
      # not the site, is at fault, so a proxy blip is not filed as an outage.
      - name: Live base-path smoke (R-17)
        env:
          R17_RETRIES: '5'
          R17_RETRY_DELAY_MS: '15000'
        run: node scripts/check-live-base-path.mjs
