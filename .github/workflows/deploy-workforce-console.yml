name: Deploy workforce console to CloudFront

on:
  push:
    branches: [main]
    paths:
      - 'apps/workforce/**'
      - 'packages/shared/**'
      - 'workforce/agents/**'         # manifest contents
      - 'scripts/build-agent-manifest.mjs'
      - '.github/workflows/deploy-workforce-console.yml'
  workflow_dispatch:

concurrency:
  group: deploy-workforce
  cancel-in-progress: true

permissions:
  contents: read
  # Required for aws-actions/configure-aws-credentials to mint a JWT and
  # assume secrets.AWS_ROLE_ARN via the configured GitHub OIDC trust.
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # AWS auth runs BEFORE the build so the build can read the live
      # backend URLs from CloudFormation stack outputs (see next step).
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          # Pinned to the data-plane region rather than secrets.AWS_REGION:
          # the stacks queried below live in us-west-2 regardless of which
          # region the deploy role's default happens to be.
          aws-region: us-west-2

      - name: Resolve backend URLs from CloudFormation
        # The SPA's API base + identity pool were hand-maintained GitHub
        # secrets (VITE_WORKFORCE_AGENTS_API_BASE etc.). Those drift the
        # instant the data plane moves region or an API is recreated — which
        # is exactly what bit us: a stale ap-northeast-1 URL pointed the live
        # SPA at a dead host and every /workforce/projects fetch died with an
        # opaque "Failed to fetch". Deriving the values from the live stack
        # outputs at deploy time keeps the bundle pinned to whatever is
        # actually deployed, with no human-maintained URL secret to rot.
        run: |
          set -euo pipefail
          out() {
            aws cloudformation describe-stacks --region us-west-2 \
              --stack-name "$1" \
              --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue" \
              --output text
          }
          AGENTS_BASE=$(out wf-data-plane-prod AgentsApiUrl)
          CREDS_BASE=$(out wf-data-plane-prod CredentialsApiUrl)
          POOL_ID=$(out wf-web-prod WorkforceIdentityPoolId)
          # Fail loud (W-4 / C-4): a missing output must turn the deploy red,
          # never silently ship a bundle that points at nothing.
          for pair in "AgentsApiUrl=$AGENTS_BASE" "CredentialsApiUrl=$CREDS_BASE" "WorkforceIdentityPoolId=$POOL_ID"; do
            name="${pair%%=*}"; val="${pair#*=}"
            if [ -z "$val" ] || [ "$val" = "None" ]; then
              echo "::error::CloudFormation output $name resolved empty — refusing to build a broken bundle"
              exit 1
            fi
          done
          {
            echo "VITE_WORKFORCE_AGENTS_API_BASE=$AGENTS_BASE"
            echo "VITE_WORKFORCE_CREDENTIALS_API_BASE=$CREDS_BASE"
            echo "VITE_COGNITO_IDENTITY_POOL_ID=$POOL_ID"
          } >> "$GITHUB_ENV"
          echo "Resolved: agents=$AGENTS_BASE creds=$CREDS_BASE pool=$POOL_ID"

      - name: Build agent manifest
        run: npm run build:agents

      - name: Build workforce SPA
        # VITE_WORKFORCE_AGENTS_API_BASE / _CREDENTIALS_API_BASE /
        # VITE_COGNITO_IDENTITY_POOL_ID come from $GITHUB_ENV (the resolve
        # step above), not from secrets. The Cognito user-pool / client /
        # domain values stay as secrets — they're not URL-shaped and haven't
        # been a drift source (follow-up: derive these from wf-web-prod too).
        env:
          VITE_GA_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ secrets.VITE_COGNITO_DOMAIN }}
        run: npm run build:workforce

      - name: Sync to S3
        # Hashed asset filenames (Vite's default) get a 1-year immutable
        # cache; everything else (index.html, manifest, sw.js if any)
        # gets no-cache so a deploy goes live the moment invalidation
        # finishes.
        run: |
          aws s3 sync apps/workforce/dist/assets/ s3://${{ secrets.AWS_S3_BUCKET }}/assets/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync apps/workforce/dist/ s3://${{ secrets.AWS_S3_BUCKET }}/ \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
