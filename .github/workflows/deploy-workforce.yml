name: Deploy workforce console to CloudFront

on:
  push:
    branches: [main]
    paths:
      - 'apps/workforce/**'
      - 'packages/shared/**'
      - 'workforce/agents/**'         # manifest contents
      - 'scripts/build-agent-manifest.mjs'
      - '.github/workflows/deploy-workforce.yml'
  workflow_dispatch:

concurrency:
  group: deploy-workforce
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Skip cleanly when the AWS secrets aren't wired up yet — first PR
    # to land this workflow won't have them set; the operator runs
    # through workforce/infra/sam-web/README.md and populates them
    # before re-running this workflow manually.
    if: vars.WORKFORCE_DEPLOY_ENABLED == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build agent manifest
        run: npm run build:agents

      - name: Build workforce SPA
        env:
          VITE_GA_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ secrets.VITE_COGNITO_DOMAIN }}
          VITE_WORKFORCE_AGENTS_API_BASE: ${{ secrets.VITE_WORKFORCE_AGENTS_API_BASE }}
        run: npm run build:workforce

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        # Hashed asset filenames (Vite's default) get a 1-year immutable
        # cache; everything else (index.html, manifest, sw.js if any)
        # gets no-cache so a deploy goes live the moment invalidation
        # finishes.
        run: |
          aws s3 sync apps/workforce/dist/assets/ s3://${{ secrets.AWS_S3_BUCKET }}/assets/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync apps/workforce/dist/ s3://${{ secrets.AWS_S3_BUCKET }}/ \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
