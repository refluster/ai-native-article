name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # R-11 (L1 citation gate) diffs against the PR base ref.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck + build
        run: npm run build

      - name: Design-token lint
        run: npm run lint:tokens

      - name: Governance registries (R-12)
        run: npm run check-registries

      - name: Proxy-bootstrap gate (R-14)
        run: npm run check-proxy-bootstrap

      - name: Base-path consistency gate (R-16)
        run: npm run check-base-path

      - name: Script library tests
        run: npm run test:scripts

      # R-15 (corpus freshness) is deliberately NOT here — see
      # .github/workflows/corpus-freshness.yml. Staleness is a property of
      # time, not of a diff: gating PRs on it blocks changes that neither
      # caused nor can fix the condition, and (as observed on PR #532) an
      # early-exiting freshness step aborts the job before R-11 and every
      # workforce gate has run, so a dead pipeline silently disables the
      # checks that actually inspect the change.

      - name: L1 citation gate (R-11)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          npm run check-l1-citation

      - name: Workforce naming lint (R-N7)
        run: npm run workforce:naming

      - name: Workforce skill schema
        run: npm run workforce:skills

      - name: Workforce skill registry freshness
        run: npm run workforce:skill-registry:check

      - name: Workforce skill manifest freshness (#185)
        run: npm run workforce:skill-manifest:check

      - name: Workforce client skill-spec drift (Dario L2-1)
        run: npm run workforce:skill-spec-drift

      - name: Workforce skill-body version-bump gate (ADR-0017)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          npm run workforce:skill-body-version

      - name: Workforce OpenAPI spec-route drift (PR #305 / Mateo M1)
        run: npm run workforce:openapi-routes

      - name: Workforce scan-drain guard (Dario L2 / FU-PROJ-SCAN)
        run: npm run workforce:scan-drain

      - name: Workforce W-4 cycle-cap guard (FU-004)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node workforce/scripts/check-cycle-count.mjs --repo "$GITHUB_REPOSITORY"

      - name: Workforce ML-009 escalation-label guard (OP-010)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node workforce/scripts/check-escalation-labels.mjs --repo "$GITHUB_REPOSITORY"

      - name: Workforce Lambda typecheck
        run: cd workforce/lambdas && npm ci && npm run typecheck

      - name: Workforce Lambda unit tests
        run: cd workforce/lambdas && npm test
