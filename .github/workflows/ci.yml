name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # R-11 (L1 citation gate) diffs against the PR base ref.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck + build
        run: npm run build

      - name: Design-token lint
        run: npm run lint:tokens

      - name: GAS manifest check
        run: npm run check-gas

      - name: Governance registries (R-12)
        run: npm run check-registries

      - name: L1 citation gate (R-11)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          npm run check-l1-citation

      - name: Workforce naming lint (R-N7)
        run: npm run workforce:naming

      - name: Workforce skill schema
        run: npm run workforce:skills

      - name: Workforce skill registry freshness
        run: npm run workforce:skill-registry:check

      - name: Workforce client skill-spec drift (Dario L2-1)
        run: npm run workforce:skill-spec-drift

      - name: Workforce OpenAPI spec-route drift (PR #305 / Mateo M1)
        run: npm run workforce:openapi-routes

      - name: Workforce Lambda typecheck
        run: cd workforce/lambdas && npm ci && npm run typecheck

      - name: Workforce Lambda unit tests
        run: cd workforce/lambdas && npm test
