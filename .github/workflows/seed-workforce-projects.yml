name: Seed workforce project membership (reconcile)

# Reconciles RUNTIME project membership (DDB PROJECT#{id}/MEMBER#{slug} rows)
# with DECLARED membership (workforce/projects/{id}/project.json:members[]).
#
# Why this exists (the failure it closes):
#   project.json:members[] is declared intent; the runtime authz source that
#   actually gates engagement/execution writes is the MEMBER# rows, written
#   ONLY by seed-projects.mjs. On 2026-06-07 five agents (theo, vikram, noor,
#   aanya, elena) were added to agent-workforce/project.json and merged, but
#   seed-projects was never re-run — so every engagement write for them
#   returned 403 not_a_member for hours, their work silently absent from the
#   track record (a C-4 "fail loud, not silent" violation).
#
#   check-project-membership-drift.yml DETECTS this drift on a daily schedule;
#   this workflow is the matching RECONCILER that removes it. Detector + no
#   reconciler meant the gap was visible but never auto-closed.
#
# Trigger model (mirrors seed-projects being a post-merge step):
#   - push to main touching workforce/projects/** — a project.json edit
#     (adding/removing a member, a new project) reconciles automatically
#     once merged. NOT run on PRs: seeding declared-but-unmerged members
#     would write rows for memberships that don't exist yet.
#   - workflow_dispatch — the operator can reconcile the live table on demand
#     (e.g. to clear a 403 immediately, without waiting for the next
#     project.json change).
#
# AWS auth: GitHub OIDC -> IAM role assumption (secrets.AWS_ROLE_ARN), the
# same role the data-plane deploy uses. No long-lived keys in repo secrets.
# seed-projects.mjs shells out to the `aws` CLI (preinstalled on the runner)
# and needs only DynamoDB GetItem/PutItem on wf-table-prod.
#
# Zone A — agent proposes; human merges (workforce/docs/governance.md §3).

on:
  push:
    branches: [main]
    paths:
      - 'workforce/projects/**'
      - 'workforce/scripts/seed-projects.mjs'
      - '.github/workflows/seed-workforce-projects.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to seed (dev or prod)'
        required: false
        default: 'prod'

concurrency:
  # Never interrupt a membership write mid-flight; serialise reconciles.
  group: seed-workforce-projects
  cancel-in-progress: false

permissions:
  contents: read
  # Required for aws-actions/configure-aws-credentials to mint a JWT and
  # assume secrets.AWS_ROLE_ARN via the configured GitHub OIDC trust.
  id-token: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate project.json files first
        # seed-projects.mjs requires validate-projects passing first (its
        # own docstring). Catches a malformed members[] before it touches DDB.
        run: npm run workforce:projects

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Seed / reconcile project membership
        # Idempotent: existing active members no-op; missing ones are added;
        # soft-revoked ones are reactivated. Defaults to prod; a manual
        # dispatch can target dev.
        run: node workforce/scripts/seed-projects.mjs "${{ github.event.inputs.stage || 'prod' }}"

      - name: Verify no membership drift remains
        # Closes the loop: after seeding, the declared==runtime invariant the
        # daily detector checks must hold. Fails the run loudly (C-4) if a
        # declared member still isn't seeded.
        run: npm run workforce:projects:membership
        env:
          AWS_REGION: us-west-2
