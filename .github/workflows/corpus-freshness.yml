name: Site health (R-15 corpus freshness, R-17 live base path)

# R-15 — is the article pipeline still producing?
#
# The L1→L2/L3 cadences fire every 6h, so in steady state the published corpus
# gains several rows a day. On 2026-07-26 both cadences began failing inside
# their CCR session and produced nothing for seven days across 28 dispatches
# the orchestrator recorded as successful. Every existing signal stayed green:
# CI, deploys, orchestrator logs. The outage was found by hand.
#
# This job watches the one observable that actually moved — whether new
# articles are arriving — and fails when they stop. A failed scheduled run
# notifies the repository owner, which for a single-operator repo (C-3) is the
# whole alerting requirement.
#
# It is a *schedule*, not a PR gate, on purpose: staleness is a property of
# time rather than of any particular diff. See the note in ci.yml.

on:
  schedule:
    # 21:00 UTC — after the last deploy-article-site run of the day (cron
    # '17 6,12,18', which GitHub routinely starts 1–2h late) has had time to
    # land, so a green pipeline is never reported stale by a timing artefact.
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      max_age_days:
        description: 'Override the staleness budget (days)'
        required: false
        default: '5'

concurrency:
  group: site-health
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Corpus freshness gate (R-15)
        env:
          MAX_AGE_DAYS: ${{ github.event.inputs.max_age_days || '5' }}
        run: node scripts/check-corpus-freshness.mjs

      # R-17 — is the live site actually loadable? Runs even when R-15 fails:
      # a stale corpus and a broken shell are independent faults, and the one
      # that hides the other is exactly how #600/#606 stayed live for a week.
      - name: Live base-path smoke (R-17)
        if: always()
        run: node scripts/check-live-base-path.mjs
