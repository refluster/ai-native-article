name: workforce-builder

# Daily Claude Code routine: implements the next unchecked item from
# workforce/ROADMAP.md and opens a draft PR (or posts "waiting on human
# merge" if the previous PR is still open with green CI).
#
# The full state-machine contract lives in:
#   workforce/docs/routine-prompt.md
#
# Zone A — agents propose this workflow file; humans merge.
# See workforce/docs/governance.md §3 and AGENTS.md §1.

on:
  schedule:
    # 09:05 JST daily (00:05 UTC). Runs after the L2/L3 GAS batches (09:00 JST)
    # so any article-health issues are already logged when the builder runs.
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: wf-builder
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "workforce-builder"
          git config user.email "wf-builder+ci@kohuehara.xyz"

      - name: Create working branch
        run: |
          BRANCH="claude/wf-builder-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Run workforce-builder routine
        uses: anthropics/claude-code-action@beta
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          direct_prompt: |
            You are the daily `workforce-builder` Claude routine. Fire-and-forget contract:

            1. Read `workforce/docs/routine-prompt.md` — it is the stable, authoritative contract for this routine. Follow its EXECUTION block exactly.
            2. The high-level state machine: (a) if the previous workforce PR is still open with green CI → leave a one-line 'waiting on human merge' comment and exit; (b) if it's open with failing CI → classify+fix (max 3 turns); (c) if it's merged → implement the next un-checked PR from `workforce/ROADMAP.md` and open a PR.
            3. NEVER run `gh pr merge` on your own work. Governance C-3 is absolute.
            4. NEVER use `--no-verify` or `--no-gpg-sign` flags. If a hook blocks, fix the underlying issue.
            5. Verify locally with `npm run build && npm run lint:tokens && npm run check-gas` before pushing.
            6. The full plan + roadmap is in the repo. Authoritative files: `workforce/README.md`, `workforce/ROADMAP.md`, `workforce/docs/routine-prompt.md`, `AGENTS.md`.
            7. Output should be a one-liner: the PR URL you opened, or '`no-op — PR #N still open, awaiting human merge`'.

            Begin by reading `workforce/docs/routine-prompt.md`.
