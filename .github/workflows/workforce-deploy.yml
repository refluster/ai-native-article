name: Workforce SAM Deploy

on:
  pull_request:
    paths:
      - 'workforce/infra/**'
      - 'workforce/lambdas/**'
      - '.github/workflows/workforce-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'workforce/infra/**'
      - 'workforce/lambdas/**'
      - '.github/workflows/workforce-deploy.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Deployment stage'
        required: true
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  id-token: write
  contents: read

concurrency:
  group: workforce-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: SAM validate + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workforce/lambdas/package-lock.json

      - name: Install lambda deps
        working-directory: workforce/lambdas
        run: npm ci

      - name: TypeScript typecheck
        working-directory: workforce/lambdas
        run: npm run typecheck

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: SAM validate
        working-directory: workforce/infra/sam
        run: sam validate --lint

      - name: SAM build
        working-directory: workforce/infra/sam
        run: sam build --parallel

      - name: SAM dry-run (PR only)
        if: github.event_name == 'pull_request'
        working-directory: workforce/infra/sam
        run: |
          sam deploy \
            --no-execute-changeset \
            --no-confirm-changeset \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides Stage=dev \
            --stack-name workforce-dev \
            --resolve-s3

  deploy-dev:
    name: Deploy dev stack
    runs-on: ubuntu-latest
    needs: validate
    # Runs on push to main (not PRs) and on manual dispatch for dev
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.stage == 'dev')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workforce/lambdas/package-lock.json

      - name: Install lambda deps
        working-directory: workforce/lambdas
        run: npm ci

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: SAM build
        working-directory: workforce/infra/sam
        run: sam build --parallel

      - name: SAM deploy (dev)
        working-directory: workforce/infra/sam
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides Stage=dev \
            --stack-name workforce-dev \
            --resolve-s3

  deploy-prod:
    name: Deploy prod stack
    runs-on: ubuntu-latest
    needs: validate
    environment: prod
    # Only on manual dispatch requesting prod
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.stage == 'prod'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workforce/lambdas/package-lock.json

      - name: Install lambda deps
        working-directory: workforce/lambdas
        run: npm ci

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: SAM build
        working-directory: workforce/infra/sam
        run: sam build --parallel

      - name: SAM deploy (prod)
        working-directory: workforce/infra/sam
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides Stage=prod \
            --stack-name workforce-prod \
            --resolve-s3
