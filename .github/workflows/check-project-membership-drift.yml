name: Check project membership drift (declared vs runtime)

# Standing guard for the project-membership drift blind spot.
#
# project.json:members[] is declared intent (version control); the runtime
# authz source is the DDB PROJECT#{id}/MEMBER#{slug} rows, written only by
# `seed-projects.mjs` run by hand. On 2026-06-07 five+ agents were added to
# agent-workforce/project.json but never seeded, so their engagement writes
# returned 403 not_a_member for hours — work silently absent from the track
# record (a C-4 fail-loud violation). Nothing caught it. This run does.
#
# Scheduled, not a PR gate: runtime only catches up to a project.json edit
# AFTER the post-merge seed step, so a pre-merge comparison would false-
# positive on the very PR that adds a member. The real failure is drift that
# persists untouched by any PR — which a periodic run catches. Mirrors
# check-workforce-api-routes.yml (a between-deploys drift sentinel).
#
# Read-only: a public GET to the wf-agents-api. No AWS credentials, no
# secrets, no writes.

on:
  schedule:
    # Daily at 09:17 UTC — offset from check-workforce-api-routes (08:17)
    # and the article gh-pages crons (06/12/18:17).
    - cron: '17 9 * * *'
  workflow_dispatch:

concurrency:
  group: check-project-membership-drift
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit declared members[] vs runtime membership
        run: npm run workforce:projects:membership
