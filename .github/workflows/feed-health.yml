name: feed-health (workforce-feed corpus sweep)

# Workforce W-1 hygiene sweep — Epic-011 Story 4 (#131). Runs the
# `feed-health` skill's CLI entry against the prod stage on:
#
#   - a nightly cron (06:00 UTC)
#   - successful completion of the workforce data-plane deploy
#     (post-deploy regression catcher — fail fast if a release that
#      touches the write path introduces a new violation class)
#
# A clean sweep exits 0 and emits CloudWatch heartbeat metrics. Any
# violation exits 1 and emits per-class violation metrics; the
# CloudWatch alarm `WfFeedHealthViolationsAlarm` pages on >0 violations
# in any single sweep.
#
# Zone B — automated check that surfaces in CI; operator triages
# alarms from the existing channels.

on:
  schedule:
    # 06:00 UTC ≈ 15:00 JST / 22:00 PT — quiet window for the operator.
    # Aligned with the existing deploy-article-site cron rhythm so
    # CloudWatch dashboards land on consistent boundaries.
    - cron: '0 6 * * *'
  workflow_run:
    workflows: ["Deploy workforce data plane (SAM)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: feed-health-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required for aws-actions/configure-aws-credentials to mint a JWT
  # and assume secrets.AWS_ROLE_ARN via the configured GitHub OIDC trust.
  id-token: write

jobs:
  sweep:
    # On the workflow_run trigger, only run if the upstream deploy
    # succeeded. Skip the sweep if the deploy failed — running it
    # against a half-applied stack is noise.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: workforce/lambdas/package-lock.json

      - name: Install lambda deps
        # The handler imports @aws-sdk/client-s3 + @aws-sdk/client-cloudwatch
        # from workforce/lambdas/node_modules. `tsx` is fetched via
        # `npx --yes tsx` so no separate install step is needed.
        run: npm ci
        working-directory: workforce/lambdas

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Run feed-health sweep against prod
        env:
          STAGE: prod
          TABLE_NAME: wf-table-prod
          BUCKET_NAME: ${{ secrets.WF_BUCKET_PROD }}
          AWS_REGION: us-west-2
        # The CLI entry exits 1 on any violation; the workflow fails,
        # the operator is paged via the CloudWatch alarm, and the
        # GHA run page shows the violation list in stderr.
        run: node workforce/scripts/feed-health.mjs
